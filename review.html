ublic water was a civic achievement.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Note fountain style, inscriptions, spout shape.", "visualClues": ["Ornate fountain with inscriptions", "Multi-spout bubbler", "Chained cup"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "London", "country": "United Kingdom", "neighbourhood": null, "specific": "first public drinking fountain 1859", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Portland", "country": "United States", "neighbourhood": null, "specific": "Benson Bubblers", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Ackroyd, Peter. London Under: The Secret History Beneath the Streets. New", "York: Knopf Doubleday Publishing Group, November 2011.", "“Benson Bubblers.” City of Portland Water Bureau website, May 2013.", "Davies, Philip. Troughs & Drinking Fountains: Fountains of Life. London:", "Chatto & Windus, 1989.", "Docevski, Bob. “The Great Stink: That time when London was overwhelmed", "with sewage stench.” The Vintage News (blog), September 5, 2016.", "Gutman, Marta. A City for Children: Women, Architecture, and the", "Charitable Landscapes of Oakland, 1850–1950. Chicago: The University", "of Chicago Press, 2014.", "Mann, Emily. “Story of cities #14: London’s Great Stink heralds a wonder of", "the industrial world.” The Guardian, April 4, 2016.", "Mingle, Katie. “188: Fountain Drinks.” 99% Invisible (podcast and MP3", "audio), November 10, 2015."], "relatedDiscoveries": ["DISC-033", "DISC-036", "DISC-035"], "media": [], "arPotential": true, "autoKeywords": ["London", "River Thames", "Snow’s", "Drinking Fountains", "Great Stink", "Queen Victoria", "British", "Earth", "Concern", "John Snow"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-035", "title": "Waste Management", "originalTitle": "Reversing Course: Waste Management", "kicker": "Reversing Course", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Water", "bookReference": {"pdfPages": [134, 137], "printedPages": null, "bibliographyPdfPage": 390, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 1051, "trailingNonStoryText": []}, "bookContent": {"summary": "Chicago dyes its river green for St. Patrick's Day (since 1961, per accounts crediting plumbers' union manager Stephen Bailey and Mayor Richard J. Daley); the dye flows away from Lake Michigan because the river was reversed. A flat city, a 1854 cholera epidemic (about 5% died), buildings raised up to ten feet on jacks under engineer Ellis Chesbrough, a two-mile lake intake tunnel, slaughterhouse waste (Bubbly Creek) and polluted intakes led to reversing the river, completed in January 1900. St. Louis sued and lost at the Supreme Court (Justice Holmes). The project was named a Monument of the Millennium by ASCE; low lake levels raise re-reversal concerns.", "function": "Waste-management engineering that rerouted a river.", "historicalContext": "1854 cholera; 1850s raising; Jan 1900 reversal; 1961 dye tradition.", "keyTakeaway": "Big infrastructure solves one problem by pushing another downstream.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Watch the Chicago River's flow direction and the green dye each March.", "visualClues": ["Green river on St. Patrick's Day", "Flow away from the lake"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Chicago", "country": "United States", "neighbourhood": null, "specific": "Chicago River, South Branch (Bubbly Creek), Lake Michigan intake", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "St. Louis", "country": "United States", "neighbourhood": null, "specific": "downstream plaintiff", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Driesen, David M., Robert W. Adler, and Kirsten H. Engel. Environmental", "Law: A Conceptual and Pragmatic Approach. New York: Wolters Kluwer,", "2016.", "Loe, Claire. “Reversing the Chicago River, Again.” Helix (blog), February", "25, 2015.", "Moser, Whet. “Dyeing the Chicago River Green: Its Origins in the Actual", "Greening of the River.” Chicago Magazine, March 16, 2012.", "O’Carroll, Eoin. “Is the dye in the Chicago River really green?” Christian", "Science Monitor, March 16, 2009.", "Sudo, Chuck. “What Are the Property Management Ties to Dyeing the", "Chicago River Green on St. Patrick’s Day?” Bisnow (blog), March 9, 2017.", "Weissmann, Dan. “86: Reversal of Fortune.” 99% Invisible (podcast and", "MP3 audio), August 8, 2013.", "Williams, Michael, and Richard Cahan. The Lost Panoramas: When Chicago", "Changed Its River and the Land Beyond. Chicago: CityFiles Press, 2011."], "relatedDiscoveries": ["DISC-036", "DISC-037", "DISC-034"], "media": [], "arPotential": false, "autoKeywords": ["Lake Michigan", "Chicago River", "Waste Management", "Chicago Plumbers’", "Stephen Bailey", "Bailey", "Irish American", "Mayor Richard", "Chicagoans", "Boston"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-036", "title": "Subsurface Cisterns", "originalTitle": "Circling Back: Subsurface Cisterns", "kicker": "Circling Back", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Water", "bookReference": {"pdfPages": [137, 138], "printedPages": null, "bibliographyPdfPage": 390, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 440, "trailingNonStoryText": []}, "bookContent": {"summary": "Nearly 200 brick circles with metal CISTERN lids in San Francisco streets mark huge underground cisterns of the Auxiliary Water Supply System, expanded after the 1906 earthquake and fires broke water mains. Each holds tens to hundreds of thousands of gallons; blue, red and black hydrant tops tie to reservoirs (Jones Street, Ashbury Street, Twin Peaks); backups include bay pumping stations (about 10,000 gal/min) and fireboats.", "function": "Redundant firefighting water supply.", "historicalContext": "1906 earthquake and fire.", "keyTakeaway": "Disaster experience is visible in street details.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for brick rings with a metal disk reading CISTERN, and colored hydrant tops.", "visualClues": ["Brick circle in the street", "CISTERN lid with checkered anti-slip grid", "Blue, red and black hydrant tops"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "San Francisco", "country": "United States", "neighbourhood": null, "specific": "around 200 street cisterns", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Dunnigan, Frank. “Streetwise—Water, Water, Everywhere.” Outside Lands", "(blog), October 19, 2015.", "Pabst, Greg. “In Case of Fire, Look to Twin Peaks.” San Francisco City", "Guides (blog), accessed October 15, 2019.", "Thompson, Walter. “Century-Old Auxiliary Water Supply System Gets New", "Ashbury Heights Tank.” Hoodline San Francisco (blog), January 22, 2015.", "Van Dyke, Steve. “San Francisco Fire Department Water Supply System.”", "Virtual Museum of the City of San Francisco (blog), accessed October 12,", "2019.", "“Water Supply Systems.” The San Francisco Fire Department website,", "accessed October 12, 2019."], "relatedDiscoveries": ["DISC-019", "DISC-037", "DISC-033"], "media": [], "arPotential": true, "autoKeywords": ["San Francisco", "Subsurface Cisterns", "Auxiliary Water Supply System", "Jones Street", "Ashbury Street", "Twin Peaks", "San Francisco Bay"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-037", "title": "Flood Mitigation", "originalTitle": "Apples to Oysters: Flood Mitigation", "kicker": "Apples to Oysters", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Water", "bookReference": {"pdfPages": [139, 142], "printedPages": null, "bibliographyPdfPage": 391, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 760, "trailingNonStoryText": ["Trailing caption: 'Utility pole supporting power grid and internet cables' (figure caption or section teaser at the end of the spread; not story text)"]}, "bookContent": {"summary": "After Hurricane Sandy (2012), some proposed floodgates or seawalls while others looked to New York's oyster past. Oyster reefs once surrounded Manhattan, filtered water and buffered waves; oysters were eaten everywhere, shells were used as mortar and paving (Pearl Street reportedly) and the beds closed in the early 1900s after outbreaks; pollution persisted until the 1972 Clean Water Act. Kate Orff's 2010 'oyster-tecture' (rope nets), SCAPE's Living Breakwaters (rocks) and the Billion Oyster Project (restaurant shells) aim to regrow reefs as hybrid ecosystem infrastructure.", "function": "Nature-based coastal protection for NYC.", "historicalContext": "1700s oysters; early 1900s closure; 1972 Clean Water Act; 2010 proposal; 2012 Sandy.", "keyTakeaway": "Hybrid ecosystem-infrastructure can mediate between land and sea.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Layer B opportunity: Living Breakwaters location and Billion Oyster Project status are not in book"]}, "observation": {"whatToLookFor": "Look for oyster-shell piles, shell collection bins at restaurants, and harbor breakwaters.", "visualClues": ["Oyster shell collection bin", "Textured rope nets or rock breakwater"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "New York City", "country": "United States", "neighbourhood": null, "specific": "harbor and Hudson estuary; Pearl Street", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": "Layer B opportunity: Living Breakwaters location and Billion Oyster Project status are not in book"}, "additionalResearch": [], "bookCitedSources": ["Environmental Protection Agency. Summary of the Clean Water Act.", "Washington, DC: Government Printing Office, 2019.", "FitzGerald, Emmett. “282: Oyster-tecture.” 99% Invisible (podcast and MP3", "audio), October 31, 2017.", "Greenberg, Paul. American Catch: The Fight for Our Local Seafood. New", "York: Penguin, 2015.", "Kurlansky, Mark. The Big Oyster: History on the Half Shell. New York:", "Random House, 2007.", "Orff, Kate. Toward an Urban Ecology. New York: The Monacelli Press,", "2016.", "“Our Purpose.” Billion Oyster Project (blog), accessed February 4, 2020."], "relatedDiscoveries": ["DISC-036", "DISC-035", "DISC-109"], "media": [], "arPotential": true, "autoKeywords": ["Manhattan", "New York City", "New York", "Hudson River", "Flood Mitigation", "America’s", "Big Apple", "Big Oyster", "Street", "Clean Water Act"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-038", "title": "Utility Poles", "originalTitle": "Fine Lines: Utility Poles", "kicker": "Fine Lines", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Technology", "bookReference": {"pdfPages": [143, 145], "printedPages": null, "bibliographyPdfPage": 391, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 740, "trailingNonStoryText": []}, "bookContent": {"summary": "Utility poles began with Samuel Morse's telegraph: after painter Morse missed his wife's death in 1825 because the letter came too late, he pursued the telegraph. In 1843 Congress funded $30,000; underground lines to Baltimore failed so wires went on trees and poles. By 1861 a transcontinental telegraph existed; Lincoln's election news took eight days in 1860, but his assassination news was almost instant. Police and fire call boxes ran on the system. A Morse statue was dedicated in Central Park in 1871. Poles grew into crowded structures; some rural people used barbed wire; today poles carry power and communications.", "function": "Support for wires carrying telegraph, phone and power.", "historicalContext": "1825; 1843 funding; 1861 transcontinental; 1871 Morse Day.", "keyTakeaway": "The humble pole came from the telegraph and still does heavy lifting.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book does not say exactly where the Morse statue stands in Central Park"]}, "observation": {"whatToLookFor": "Look at pole crossarms, attachments, call boxes and wooden vs metal supports.", "visualClues": ["Wooden pole with crossbeams", "Bundled cables", "Call box"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "Central Park", "specific": "1871 Morse statue dedication", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Washington, D.C.", "country": "United States", "neighbourhood": null, "specific": "Capitol to Baltimore line start", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book does not say exactly where the Morse statue stands in Central Park"}, "additionalResearch": [{"claim": "The Samuel F. B. Morse statue stands just inside Inventors' Gate at 72nd Street and Fifth Avenue on the east side of Central Park. It was sculpted by Byron Pickett and unveiled on 27 April 1871, Morse's 80th birthday.", "neighbourhood": "Central Park (East Side)", "sources": [{"title": "Samuel F. B. Morse (Central Park Conservancy)", "url": "https://centralparknyc.org/locations/samuel-f-b-morse"}], "verification": "single source from the park's managing organisation; no coordinates printed, so the pin is estimated from the street grid", "addresses": ["Book does not say exactly where the Morse statue stands in Central Park"], "layer": "B", "accessed": "2026-11-17"}], "bookCitedSources": ["Botjer, George. Samuel F.B. Morse and the Dawn of Electricity. Washington,", "DC: Lexington Books, 2015.", "Bullard, Gabe. “The Heartbreak That May Have Inspired the Telegraph.”", "National Geographic, April 26, 2016.", "Lowndes, Coleman. “DC’s abandoned fire and police call boxes, explained.”", "Vox website, August 10, 2017.", "Mulqueen, April. “A Natural History of the Wooden Telephone Pole.”", "California Public Utilities Commission—Policy and Planning Division", "website, accessed October 23, 2019.", "Updike, John. Telephone Poles and Other Poems. New York: Alfred A.", "Knopf, 1963.", "Wildermuth, John. “Why S.F. still counts on street fire alarm.” San Francisco", "Chronicle, February 7, 2012."], "relatedDiscoveries": ["DISC-039", "DISC-042", "DISC-003"], "media": [], "arPotential": true, "autoKeywords": ["Morse", "America’s", "Washington", "West Coast", "Utility Poles", "Updike", "Telephone Poles", "Indeed", "Samuel Morse", "American"], "verificationStatus": "book-reviewed-full-text; layer-B-researched"}, {"id": "DISC-039", "title": "Power Grids", "originalTitle": "Alternated Currents: Power Grids", "kicker": "Alternated Currents", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Technology", "bookReference": {"pdfPages": [145, 146], "printedPages": null, "bibliographyPdfPage": 392, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 596, "trailingNonStoryText": []}, "bookContent": {"summary": "Los Angeles was an early adopter of electric street lighting, but a Southern California engineer chose 50 hertz while the rest of the US used 60. A New York clock on a 50 Hz grid would lose about ten minutes an hour. After Hoover Dam supplied 60 Hz power, LA switched in 1936; Southern California Edison converted a million customers by 1948 (475,000 clocks, 380,000 fixtures, 60,000 refrigerators reworked; 'clock depots'). Frequencies still differ worldwide; Japan's incompatible grids caused blackouts after Fukushima.", "function": "Standards decision that shows grid inertia.", "historicalContext": "Late 1800s; 1936 LA switch; 1946-48 regional conversion.", "keyTakeaway": "Early infrastructure choices lock in costs for decades.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Check appliance labels for 50/60 Hz and look at plugs and substations when traveling.", "visualClues": ["Appliance label 50/60 Hz"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Los Angeles", "country": "United States", "neighbourhood": null, "specific": "1936 switch to 60 Hz", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Japan", "country": "Japan", "neighbourhood": null, "specific": "split 50/60 Hz grids", "precision": "country", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["“First Electricity in Los Angeles.” Water and Power Associates (blog),", "accessed October 13, 2019.", "“LA. Confidential: Energy’s Changing Landscape, Yesterday and Today.”", "Energy Today (blog), July 25, 2018.", "Masters, Nathan. “Before 1948, LA’s Power Grid Was Incompatible with the", "Rest of the US.” Gizmodo (blog), February 4, 2015.", "Mingle, Katie. “263: You Should Do a Story.” 99% Invisible (podcast and", "MP3 audio), June 20, 2017."], "relatedDiscoveries": ["DISC-040", "DISC-041", "DISC-038"], "media": [], "arPotential": false, "autoKeywords": ["Los Angeles", "Southern California", "Power Grids", "Angeles", "New York", "California’s", "California", "Hoover Dam", "City of Los Angeles", "Southern California Edison"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-040", "title": "Street Lights", "originalTitle": "Moonlight Towers: Street Lights", "kicker": "Moonlight Towers", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Technology", "bookReference": {"pdfPages": [146, 149], "printedPages": null, "bibliographyPdfPage": 392, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 591, "trailingNonStoryText": []}, "bookContent": {"summary": "Austin, Texas built 31 'moonlight towers' in 1894 with six carbon-arc lights each (about 1,000 times brighter than gas), up to fifteen stories tall; New York, Baltimore and Detroit had similar arc systems. Problems: glare, buzzing, ash, nightly electrode changes. Most cities removed them by the 1920s but Austin lacked funds, then recognized them as monuments (National Register of Historic Places, 1976); about a dozen remain, repaired with custom-cast parts, and appear in Dazed and Confused.", "function": "Early high-intensity municipal lighting preserved as heritage.", "historicalContext": "1894 Austin; 1920s removal elsewhere; 1976 NRHP.", "keyTakeaway": "An evolutionary dead end can become a cultural artifact.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for tall trussed towers with lamp clusters.", "visualClues": ["Trussed tower with six lights", "Guy wires"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Austin", "country": "United States", "neighbourhood": null, "specific": "about 12 surviving moonlight towers", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Dazed and Confused. Directed by Richard Linklater. Universal City, CA:", "Universal Studios, 1993.", "Freeberg, Ernest. The Age of Edison: Electric Light and the Invention of", "Modern America. New York: Penguin, 2014.", "Oppenheimer, Mark. “Austin’s Moon Towers, Beyond ‘Dazed and", "Confused.’” New York Times, February 13, 2014.", "Prince, Jackson. “The Complete Guide to Austin’s Moonlight Towers.” The", "Austinot (blog), March 26, 2018.", "Thornby, Hanna. “Celebrate the 120th anniversary of Austin’s moonlight", "towers.” All Ablog Austin (blog), May 19, 2015.", "Trufelman, Avery. “150: Under the Moonlight.” 99% Invisible (podcast and", "MP3 audio), January 27, 2015."], "relatedDiscoveries": ["DISC-038", "DISC-039", "DISC-113"], "media": [], "arPotential": true, "autoKeywords": ["Austin", "Street Lights", "Texas", "Wabash", "Indiana", "York", "Baltimore", "Detroit", "Eiffel Towers", "National Register of Historic Places"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-041", "title": "Electricity Meters", "originalTitle": "Dialed Back: Electricity Meters", "kicker": "Dialed Back", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Technology", "bookReference": {"pdfPages": [149, 150], "printedPages": null, "bibliographyPdfPage": 392, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 590, "trailingNonStoryText": []}, "bookContent": {"summary": "In the mid-1970s Steven Strong wired rooftop solar panels on a New England apartment building and sent excess power to the grid, and the meter ran backward. Meters (Edison first billed by bulb count) turn both ways, which set a precedent for net metering at retail rate. As solar spread, utilities argued the retail credit costs them; solutions under discussion include redesigned meters reflecting the time-varying value of electrons, balancing homeowner incentives and grid upkeep.", "function": "Meter design that shaped energy policy.", "historicalContext": "1970s Strong; Edison's bulb-count billing; 2000s adoption.", "keyTakeaway": "A meter's accidental behavior created a policy fight.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Check household meters for dials running backward and solar panels on roofs.", "visualClues": ["Rotating dial", "Solar panels on a roof"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "New England", "country": "United States", "neighbourhood": null, "specific": "apartment building with first net-metered panels (unspecified)", "precision": "region", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Evans-Brown, Sam, and Logan Shannon. “257: Reversing the Grid.” 99%", "Invisible (podcast and MP3 audio), May 2, 2017.", "Johnstone, Bob. Switching to Solar: What We Can Learn from Germany’s", "Success in Harnessing Clean Energy. Blue Ridge Summit, PA:", "Prometheus Books, 2010.", "“Net Metering.” Solar Energy Industries Association website, accessed", "November 9, 2019."], "relatedDiscoveries": ["DISC-039", "DISC-042"], "media": [], "arPotential": true, "autoKeywords": ["Electricity Meters", "New England", "Strong", "Thomas Edison"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-042", "title": "Internet Cables", "originalTitle": "Network Effects: Internet Cables", "kicker": "Network Effects", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Technology", "bookReference": {"pdfPages": [150, 152], "printedPages": null, "bibliographyPdfPage": 393, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 408, "trailingNonStoryText": ["Trailing caption: 'Residential roadway with centerline and various users' (figure caption or section teaser at the end of the spread; not story text)"]}, "bookContent": {"summary": "About 99% of international data travels through a few hundred undersea fiber-optic cables up to 25,000 feet deep, hundreds of thousands of miles in total. Routes avoid reefs and shipwrecks; cables are buried in shallow water and armored against sharks, fishing and anchors. Cable failures happen a few times weekly, mostly human-caused, and specialized ships splice repairs. Satellites remain slower and more expensive, so the cloud is mostly under the ocean.", "function": "Reveals the physical backbone of the internet.", "historicalContext": "Not dated.", "keyTakeaway": "The 'cloud' is cables on the seabed.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for cable landing stations and signs at beaches warning against anchoring.", "visualClues": ["Beach landing markers"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "not place-specific", "places": [], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Burgess, Matt. “Ever wondered how underwater cables are laid? We take a", "trip on the ship that keeps us online.” Wired, November 30, 2016.", "Edwards, Phil. “A map of all the underwater cables that connect the internet.”", "Vox website, updated November 8, 2015.", "A Journey to the Bottom of the Internet. YouTube video, December 16, 2016.", "“Secrets of Submarine Cables—Transmitting 99 percent of all international", "data!” NEC Global website, accessed January 4, 2020.", "“Submarine Cable Frequently Asked Questions.” TeleGeography website,", "accessed January 4, 2020.", "What’s Inside the Undersea Internet? YouTube video, December 16, 2016."], "relatedDiscoveries": ["DISC-041", "DISC-038", "DISC-032"], "media": [], "arPotential": false, "autoKeywords": ["Internet Cables"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-043", "title": "Painting Centerlines", "originalTitle": "Accelerating Change: Painting Centerlines", "kicker": "Accelerating Change", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Roadways", "bookReference": {"pdfPages": [153, 154], "printedPages": null, "bibliographyPdfPage": 393, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 621, "trailingNonStoryText": []}, "bookContent": {"summary": "Edward N. Hines is credited with the centerline, first painted in Wayne County (Detroit) in 1911 (one tale says inspired by a leaking milk truck). Dennis Shaffer's Ohio State students estimated dashes at about two feet, whereas guidelines call for 10-foot dashes with 30-foot gaps, because speed and distant gaze distort perception. Wide, open roads and removing roadside trees reduce edge friction and invite speeding; closing in space with trees makes drivers more cautious.", "function": "Explains how road geometry shapes driver speed.", "historicalContext": "1906 Wayne County Road Commission; 1911 first centerline.", "keyTakeaway": "People use the space they are given, so road design sets speed.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Compare dash lengths, street trees and road width.", "visualClues": ["Long dashes on highways", "Trees between road and sidewalk"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Wayne County (Detroit area)", "country": "United States", "neighbourhood": null, "specif  page numbers not preserved)", "wordsInStory": 441, "trailingNonStoryText": []}, "bookContent": {"summary": "Karl Peglau designed East Germany's Ampelmaennchen in 1961 using shape as well as color (hat-wearing walk and stop men) for color-blind and low-vision users. After reunification, plans to standardize caused protests; the figures were preserved in the East and spread west, becoming ostalgie icons with millions of euros of merchandise (Deutsche Welle). City-specific pedestrian icons elsewhere vary in pose and movement.", "function": "Pedestrian signal figures as identity.", "historicalContext": "1961 design; reunification.", "keyTakeaway": "Small signals become cultural symbols.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Compare pedestrian signal figures between cities.", "visualClues": ["Hat-wearing walking man", "Standing man with arms out"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Berlin", "country": "Germany", "neighbourhood": null, "specific": "East Germany Ampelmaennchen (book says East Germany; Berlin implied by the Wall)", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["“Ampelmännchen Is Still Going Places.” Deutsche Welle, June 16, 2005.", "Barkai, Maya. Walking Men Worldwide website, accessed October 19, 2019.", "“The development of the East German Ampelmännchen.” Ampelmänn", "website, accessed October 19, 2019.", "“East German Loses Copyright Battle over Beloved Traffic Symbol.”", "Deutsche Welle, June 17, 2006.", "Peglau, Karl. “Das Ampelmännchen oder: Kleine östl ts Major Intersections for Pedestrians,", "Not Cars.” Fast Company, April 8, 2016.", "Renn, Aaron M. “When New York City tried to ban cars—the extraordinary", "story of ‘Gridlock Sam.’” The Guardian, June 1, 2016.", "“Superblocks.” Ajuntament de Barcelona—Ecology, Urban Planning and", "Mobility website, accessed October 21, 2019.", "Willsher, Kim. “Paris divided: two-mile highway by Seine goes car-free for", "six months.” The Guardian, September 9, 2016."], "relatedDiscoveries": ["DISC-053", "DISC-055", "DISC-122", "DISC-091"], "media": [], "arPotential": true, "autoKeywords": ["Manhattan", "New York City", "Gridlock Sam", "Easing Gridlock", "France", "London", "Barcelona", "China", "Sam Schwartz", "Midtown Manhattan"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-055", "title": "Naked Streets", "originalTitle": "Extravehicular Activities: Naked Streets", "kicker": "Extravehicular Activities", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Public", "bookReference": {"pdfPages": [177, 179], "printedPages": null, "bibliographyPdfPage": 398, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 514, "trailingNonStoryText": ["Photo caption 'Stabilized ruins along the Mississippi River in Minneapolis' (figure caption at the end of the spread; not story text)"]}, "bookContent": {"summary": "The 'naked streets' or shared-space movement removes signals, signs, curbs and barriers so users negotiate visually (UK Department for Transport; a Dutch advocate walks backward with eyes closed). Poynton, England spent 4 million pounds to strip its center, leaving a sign 'Poynton Shared Space Village'. Data show fewer collisions and up to 50% shorter delays, but pedestrians still follow old crossings and disabled people, especially the visually impaired, are poorly protected; Danish designs combine shared space with textures and button crosswalks.", "function": "Debates over removing traffic and partially sighted people in a shared space.” Report for the", "Guide Dogs for the Blind Association and Danish Building Research", "Institute, accessed October 2, 2019.", "“‘Shared’ road schemes paused over dangers to blind people.” BBC News,", "July 27, 2018.", "Toth, Gary. “Where the Sidewalk Doesn’t End: What Shared Space Has to", "Share.” Project for Public Spaces website, August 16, 2009."], "relatedDiscoveries": ["DISC-049", "DISC-054", "DISC-051"], "media": [], "arPotential": false, "autoKeywords": ["Naked Streets", "Europe", "British Department", "Transport", "Dutch", "Poynton", "England", "Britain", "Danish Building Research Institute", "Mississippi River"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-056", "title": "Locked Entries", "originalTitle": "Imperfect Security: Locked Entries", "kicker": "Imperfect Security", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Liminal", "bookReference": {"pdfPages": [183, 185], "printedPages": null, "bibliographyPdfPage": 400, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 812, "trailingNonStoryText": []}, "bookContent": {"summary": "For about seventy years from the late 1700s, Joseph Bramah's lock gave seeming perfect security; he publicly offered 200 guineas to anyone who could pick it. Jeremiah Chubb's detector lock froze when tampered and alerted owners; a jailed burglar failed for months to open it. In 1851 American locksmith Alfred Charles Hobbs, at the Great Exhibition (Crystal Palace), picked Chubb's lock and, after 50+ hours over two weeks, Bramah's. Today most locks (pin-and-tumbler) are cheap, and security rests on social order.", "function": "Shows that locks are only as strong as the trust around them.", "historicalContext": "Late 1700s Bramah; Chubb; 1851 Great Exhibition.", "keyTakeaway": "Perfect security is a myth; trust holds doors closed.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look at lock types and the strike plates and bolts on entries.", "visualClues": ["Pin-and-tumbler cylinder", "Padlock on a storefront"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "London", "country": "United Kingdom", "neighbourhood": null, "specific": "Bramah's storefront; 1851 Great Exhibition at the Crystal Palace", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Greenspan, Sam. “160: Perfect Security.” 99% Invisible (podcast and MP3", "audio), April 14, 2015.", "Phillips, Bill. Locksmith and Security Professionals’ Exam Study Guide. New", "York: McGraw Hill, 2009.", "Towne, Schuyler. “Rethinking the Origins of the Lock.” Schuyler Towne", "(blog), accessed October 21, 2019.", "Vanderbilt, Tom. “Alfred C. Hobbs: The American who shocked Victorian", "England by picking the world’s strongest lock.” Slate, March 11, 2013."], "relatedDiscoveries": ["DISC-057", "DISC-058", "DISC-004"], "media": [], "arPotential": false, "autoKeywords": ["Chubb", "London", "Bramah’s", "Hobbs", "Locked Entries", "English", "Joseph Bramah", "Jeremiah Chubb’s", "British", "American"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-057", "title": "Revolving Doors", "originalTitle": "Open and Shut: Revolving Doors", "kicker": "Open and Shut", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Liminal", "bookReference": {"pdfPages": [185, 186], "printedPages": null, "bibliographyPdfPage": 400, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 538, "trailingNonStoryText": []}, "bookContent": {"summary": "Theophilus Van Kannel brought the revolving door from Germany to New York in the late 1800s, installing one at a Times Square restaurant per the book. Revolving doors exchange eight times less air than swinging doors (MIT students, 2006), saving HVAC energy, yet most people use adjacent swinging doors, so spacious compartments and staff behavior matter. The 1942 Cocoanut Grove fire in Boston killed 492 when its revolving door jammed and other exits were bolted or opened inward; Massachusetts then required outward-swinging doors with panic bars beside revolving doors.", "function": "Door that saves energy but can trap people.", "historicalContext": "Late 1800s NYC; 2006 MIT study; 1942 Cocoanut Grove fire; 1943 Massachusetts laws.", "keyTakeaway": "Doors matter even more for letting people out than for letting them in.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book says Times Square restaurant; requires verification (name and date) via Layer B before mapping a precise pin"]}, "observation": {"whatToLookFor": "At building entrances, compare revolving vs swinging doors and panic bars.", "visualClues": ["Revolving door flanked by swinging doors", "Panic bar"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "Times Square", "specific": "restaurant with first revolving door", "precision": "neighbourhood", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Boston", "country": "United States", "neighbourhood": null, "specific": "Cocoanut Grove nightclub fire, 1942", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book says Times Square restaurant; requires verification (name and date) via Layer B before mapping a precise pin"}, "additionalResearch": [{"claim": "Two secondary sources place the first New York revolving door at Times Square: a 99% Invisible transcript says it was installed there in 1899 (no restaurant named), and a Daytonian in Manhattan article says Rector's restaurant at 1508-1510 Broadway (Longacre Square, near 43rd Street) had 'a revolving door, reportedly the first in New York City' and was operating by 1899.", "neighbourhood": "Times Square", "sources": [{"title": "99% Invisible: Revolving Doors (transcript)", "url": "https://99percentinvisible.org/episode/revolving-doors/transcript/"}, {"title": "Daytonian in Manhattan: The Lost Rector's Restaurant, 1508-1510 Broadway", "url": "https://daytoninmanhattan.blogspot.com/2023/01/the-lost-rectors-restaurant-1508-1510.html"}], "verification": "the identification of the restaurant rests on one blog ('reportedly'); the restaurant's name is not in the book; needs an archival or primary source", "addresses": ["Book says Times Square restaurant; requires verification (name and date) via Layer B before mapping a precise pin"], "layer": "B", "accessed": "2026-11-17"}], "bookCitedSources": ["Cullum, B. A., Olivia Lee, Sittha Sukkasi, and Dan Wesolowski. “Modifying", "Habits Towards Sustainability—A Study of Revolving Door Usage on the", "MIT Campus.” Report for Planning for Sustainable Development, May 25,", "2006.", "“Deadliest U.S. nightclub fire influences safety codes, burn care.” CBS News,", "November 28, 2017.", "Grant, Casey E. “Last Dance at the Cocoanut Grove.” NFPA Journal 101, no.", "6 (2007): 46–71.", "Greenspan, Sam. “93: Revolving Doors.” 99% Invisible (podcast and MP3", "audio), November 6, 2013.", "“The Story of the Cocoanut Grove Fire.” Boston Fire Historical Society", "website, accessed July 2, 2019."], "relatedDiscoveries": ["DISC-058", "DISC-056", "DISC-065"], "media": [], "arPotential": true, "autoKeywords": ["Revolving Doors", "Big Apple", "Times Square", "Cannot Be Left Open", "Blown Open", "Slammed", "Always Closed", "Yet Allowing the Passage of Persons", "Boston’s Cocoanut Grove", "Massachusetts"], "verificationStatus": "book-reviewed-full-text; layer-B-researched"}, {"id": "DISC-058", "title": "Emergency Exits", "originalTitle": "Improved Egress: Emergency Exits", "kicker": "Improved Egress", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Liminal", "bookReference": {"pdfPages": [186, 190], "printedPages": null, "bibliographyPdfPage": 400, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 737, "trailingNonStoryText": ["Trailing caption: 'Homes in St. Louis partially demolished by brick thieves' (figure caption or section teaser at the end of the spread; not story text)"]}, "bookContent": {"summary": "Fire escapes evolved from cart ladders to mid-1800s New York requirements for tenements; landlords chose cheap rope baskets, parachute hats and other gimmicks before iron fire escapes. The Asch Building (ten stories, two staircases plus exterior ladder) housed the Triangle Shirtwaist Company on the top three floors; in the 1911 fire 146 died, many on the ninth floor trapped by locked doors and a collapsing metal fire escape, though the building survived. The NFPA found exterior escapes poorly used, rusting, and hard for children, disabled people and women in long skirts; people flee by familiar stairs. Modern systems integrate protected fire stairs; metal escapes are mostly vestigial.", "function": "Egress design and safety law.", "historicalContext": "Mid-1800s NYC rules; 1911 Triangle Shirtwaist fire; NFPA study afterward.", "keyTakeaway": "Fireproofing a building is not enough; people must be able to leave it.", "readDepth": "full story text read and checked against ress is not in the book"], "layer": "B", "accessed": "2026-11-17"}], "bookCitedSources": ["“Keep a Fire-Escape Under the Window-Sill.” Popular Science Monthly,", "December 1918.", "Lynch, Timothy D. “Deterioration of the Historic Construction & Prior", "Codes—How They Mesh.” IES—Investigative Engineering Services", "course outline, October 22, 2015.", "“Triangle Shirtwaist Factory Fire.” The History Channel website, December", "2, 2009.", "Trufelman, Avery. “122: Good Egress.” 99% Invisible (podcast and MP3", "audio), August 8, 2014.", "“U.S. Census Bureau History: The Triangle Shirtwaist Fire.” U.S. Census", "Bureau website, March 2016.", "Young, Lauren. “The Creative and Forgotten Fire Escape Designs of the", "1800s.” Atlas Obscura (blog), December 9, 2016."], "relatedDiscoveries": ["DISC-057", "DISC-056", "DISC-062"], "media": [], "arPotential": true, "autoKeywords": ["Asch Building", "Emergency Exits", "New York", "York’s", "Triangle Shirtwaist Company", "Triangle Shirtwaist Factory Fire", "National Fire Protection Association"], "verificationStatus": "book-reviewed-full-text; layer-B-researched"}, {"id": "DISC-059", "title": "Recycling Brick", "originalTitle": "Stolen Facades: Recycling Brick", "kicker": "Stolen Facades", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Materials", "bookReference": {"pdfPages": [191, 193], "printedPages": null, "bibliographyPdfPage": 401, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 739, "trailingNonStoryText": []}, "bookContent": {"summary": "Air-dried bricks (early river-valley cities) gave way to fired bricks (Romans; revived by the Industrial Revolution). After a 1849 fire St. Louis required fireproof construction and, with high-quality red clay and coal, became a brick powerhouse (world's largest brick company by 1890). Post-WWII white flight and the GI Bill emptied urban homes; by the early 2000s brick theft destroyed dozens of North St. Lou }, {"id": "DISC-060", "title": "Cracking Concrete", "originalTitle": "Aggregate Effects: Cracking Concrete", "kicker": "Aggregate Effects", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Materials", "bookReference": {"pdfPages": [193, 196], "printedPages": null, "bibliographyPdfPage": 401, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 769, "trailingNonStoryText": []}, "bookContent": {"summary": "Boston City Hall (1968), a Brutalist concrete building with cantilevered floors, drew demolition calls from the start (Ada Louise Huxtable's 'architectural gap'). Concrete's history runs from Roman works (the Pantheon, the largest unreinforced concrete dome) through reinforced concrete of the early 1900s. Concrete varies with local ingredients, but rebar rust cracks it, so modern structures decay within decades; researchers study Roman mixes and self-healing concrete. It is the second most consumed material after water, energy-intensive, and requires billions of tons of sand yearly.", "function": "Explains concrete's promise, local character and costs.", "historicalContext": "Roman concrete; early 1900s revival; 1968 Boston City Hall.", "keyTakeaway": "Concrete is global and local, durable and fragile, and environmentally costly.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for rust stains, cracks and spalling on concrete and the texture of local aggregate.", "visualClues": ["Rust-stained cracks", "Cantilevered concrete floors", "Visible aggregate"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Boston", "country": "United States", "neighbourhood": null, "specific": "Boston City Hall (completed 1968)", "precision": "exact-site", "source": "book  560, "trailingNonStoryText": []}, "bookContent": {"summary": "Taxes shaped British and Dutch architecture: the 1784 brick tax produced oversized bricks; a 1684 hearth-tax workaround started a fire; the 1696 window tax led to bricked-up windows still visible; 1712 wallpaper tax and 1746 glass weight tax changed interiors and glassware. Amsterdam's tall, thin canal houses minimized frontage tax and need exterior hoists with hooks.", "function": "Tax rules written into buildings.", "historicalContext": "1684, 1696, 1712, 1746, 1784.", "keyTakeaway": "Taxation leaves a visible legacy in design.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for blocked-up windows, hoist hooks under gables, unusually large old bricks.", "visualClues": ["Bricked-up window openings", "Hoist hook at gable", "Narrow deep houses"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Amsterdam", "country": "Netherlands", "neighbourhood": null, "specific": "canal houses", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "United Kingdom", "country": "United Kingdom", "neighbourhood": null, "specific": "window tax windows", "precision": "country", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["“Brick Tax 1784–1850.” Scottish Brick History website, accessed October", "21, 2019.", "Howell, Jeff. “On the level: building tax.” The Telegraph, July 31, 2002.", "Hurst-Vose, Ruth. Glass. New York: Collins, 1980.", "Janse, Herman. Building Amsterdam. London: Egmont, 1994.", "Kohls "DISC-065", "DISC-077", "DISC-069"], "media": [], "arPotential": true, "autoKeywords": ["United States", "Property Limits", "English", "Contract Air Mail Act", "Air Commerce Act", "Lee Causby", "Supreme Court", "Causby", "New York", "Big Apple"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-065", "title": "Modern Elevators", "originalTitle": "Braking good: Modern Elevators", "kicker": "Braking good", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Towers", "bookReference": {"pdfPages": [209, 210], "printedPages": null, "bibliographyPdfPage": 404, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 519, "trailingNonStoryText": []}, "bookContent": {"summary": "Elisha Otis did not invent elevators; after seeing a platform fall at a furniture factory he developed a safety brake and in 1854 demonstrated it at the New York Crystal Palace, cutting the rope on a forty-foot platform and falling only inches. He sold the first passenger elevator, for a five-story New York retail building, in 1857. After his death in 1861 his sons marketed to hotels, flipping the premium from ground floor to penthouse. The Otis double-decker at the 2,717-foot Burj Khalifa (2009) rises 124 floors in about a minute.", "function": "Safety brake that made tall buildings viable.", "historicalContext": "Early 1800s; 1854 Crystal Palace demonstration; 1857 first passenger elevator; 2009 Burj Khalifa.", "keyTakeaway": "The safe elevator made skyscrapers possible and inverted floor prestige.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book does not name the 1857 building; Layer B research identifies it as the Haughwout Building (488-492 Broadway, SoHo), which needs cross-checking"]}, "observation": {"whatToLookFor": "Look for Otis nameplates, old elevator dials and inspection certificates.", "visualClues": ["Elevator b  Stearns's 22-foot-wide Broadway site led architect Bradford Lee Gilbert to propose a steel skeleton carrying thin masonry 'curtain walls' for his Tower Building (completed 1889). Gilbert moved his office into the penthouse and reportedly climbed the frame in 80-mph winds to drop a plumb line. 'Frame and cladding' became universal; the Tower Building was demolished after a few decades.", "function": "Structural logic of the modern skyscraper.", "historicalContext": "1889 Tower Building; 1891 Monadnock.", "keyTakeaway": "Walls stopped holding buildings up and started hanging on a frame.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book gives no street address for the Tower Building; the site is now occupied by other buildings (not checked)"]}, "observation": {"whatToLookFor": "Look for slim cladding, grid frames and glass-and-metal skins.", "visualClues": ["Thin masonry skin on a steel frame", "Glass curtain wall"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": null, "specific": "Tower Building site on Broadway (demolished)", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Chicago", "country": "United States", "neighbourhood": null, "specific": "Monadnock Building", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book gives no street address for the Tower Building; the site is now occupied by other buildings (not checked)"}, "additionalResearch": [], "bookCitedSources": ["Dimeo, Nate. “27: Bridge to the Sky.” 99% Invisible (podcast and MP3", "audio), June 3, 2011.", "Gray, Christopher. “Streetscapes/The Tower Building: The Idea That Led to", "New York’s First Skyscraper.” New York Times, May 5, 1996.", "“Monadnock Building.” Chicagology website, accessed October 25, 2019.", "Morris, Lloyd. Incredible New York: High Life and Low Life from 1850 to", "1950. Syracuse, NY: Syracuse University Press, 1996."], "relatedDiscoveries": ["DISC-065", "DISC-067", "DISC-060", "DISC-068"], "media": [], "arPotential": false, "autoKeywords": ["Gilbert", "Tower Building", "Gilbert’s", "Curtain Walls", "Roman", "Monadnock Building", "Chicago", "John Noble Stearns", "New York City", "Broadway"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-067", "title": "Skyscraper Races", "originalTitle": "Topping Out: Skyscraper Races", "kicker": "Topping Out", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Towers", "bookReference": {"pdfPages": [212, 213], "printedPages": null, "bibliographyPdfPage": 405, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 625, "trailingNonStoryText": []}, "bookContent": {"summary": "Rival architects William Van Alen (Chrysler Building for Walter Chrysler) and H. Craig Severance (40 Wall Street) raced to be tallest in 1920s New York, raising announced heights past the 792-foot Woolworth Building (820 vs 840 feet) until Van Alen hoisted a hidden 185-foot spire from inside the Chrysler's crown, reaching 1,046 feet. The Empire State Building overtook both less than a year later; the Chrysler's Art Deco details made it iconic while 40 Wall Street (later the Trump Building) is little pictured.", "function": "Skyscraper height competition as drama.", "historicalContext": "1920s Roaring Twenties.", "keyTakeaway": "Record heights are short-lived; distinctive design lasts.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Neighbourhoods inferred, not stated in book text"]}, "observation": {"whatToLookFor": "Compare the Chrysler Building's crown and details with 40 Wall Street.", "visualClues": ["Steel-clad arches and sunburst windows", "Eagle ornaments like hood ornaments", "Hubcap-like friezes"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "Midtown Manhattan", "specific": "Chrysler Building", "precision": "exact-site", "source": "book text (full-text review)", "verification": "neighbourhood inferred; requires verification"}, {"city": "New York City", "country": "United States", "neighbourhood": "Financial District", "specific": "40 Wall Street", "precision": "exact-site", "source": "book text (full-text review)", "verification": "neighbourhood inferred; requires verification"}, {"city": "New York City", "country": "United States", "neighbourhood": null, "specific": "Woolworth Building; Empire State Building", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": "Neighbourhoods inferred, not stated in book text"}, "additionalResearch": [{"claim": "The Chrysler Building (405 Lexington Avenue) was completed and opened on 27 May 1930 and became the world's tallest building, taking the title from 40 Wall Street. It held the title until 1 May 1931, when the Empire State Building surpassed it (about 11 months). Wikipedia coordinates: 40°45′06″N 73°58′31″W.", "neighbourhood": "Midtown Manhattan", "coordinates": {"lat": 40.75167, "lng": -73.97528, "source": "Wikipedia infobox (converted from degrees)", "status": "externally sourced (single source)"}, "sources": [{"title": "Chrysler Building (Wikiwand mirror of Wikipedia)", "url": "https://wikiwand.com/en/Chrysler_Building"}], "verification": "single secondary source (a mirror of Wikipedia)", "layer": "B", "accessed": "2026-11-17"}], "bookCitedSources": ["Bascomb, Neal. Higher: A Historic Race to the Sky and the Making of a City.", "New York: Broadway Books, 2004.", "Gray, Christopher. “Streetscapes: 40 Wall Street; A Race for the Skies, Lost", "by a Spire.” New York Times, November 15, 1992.", "Mars, Roman. “100: Higher and Higher.” 99% Invisible (podcast and MP3", "audio), February 3, 2014."], "relatedDiscoveries": ["DISC-068", "DISC-069", "DISC-065", "DISC-066"], "media": [], "arPotential": true, "autoKeywords": ["Van Alen", "Chrysler Building", "Wall Street", "Skyscraper Races", "Dubai", "China", "Saudi Arabia", "South Korea", "Severance", "Severance’s"], "verificationStatus": "book-reviewed-full-text; layer-B-researched"}, {"id": "DISC-068", "title": "Managing Crises", "originalTitle": "Unanticipated Loads: Managing Crises", "kicker": "Unanticipated Loads", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Towers", "bookReference": {"pdfPages": [213, 216], "printedPages": null, "bibliographyPdfPage": 405, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 774, "trailingNonStoryText": []}, "bookContent": {"summary": "Citicorp Center in Midtown Manhattan (59 stories; the book dates it 1967) stands on stilts at the middle of each side because a church kept its corner. Engineer William LeMessurier used chevron bracing and a tuned mass damper. In 1978 student Diane Hartley's thesis questions revealed vulnerability to quartering (corner) winds, worsened by bolted rather than welded joints; a storm that could topple it came about every 55 years (about 1 in 16 per year of failure per LeMessurier's figuring). Secret overnight welding, an evacuation plan covering a ten-block radius, 2,500 Red Cross volunteers, and a newspaper strike kept it quiet until Joe Morgenstern's 1995 New Yorker story.", "function": "Case study of a hidden structural flaw found and fixed.", "historicalContext": "Book: built 1967; crisis 1978; story broke 1995.", "keyTakeaway": "Engineering ethics: disclose and fix even secret flaws.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book gives 1967 as the build date, which requires verification (construction ran later); church name not given in book text"]}, "observation": {"whatToLookFor": "Look at the base of the building, where the tower stands on stilts at the middle of each side above the corner church, and at the steeply sloped roof.", "visualClues": ["Stilts at the middle of each facade", "Steeply sloped roof", "Corner church beneath the tower"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "Midtown Manhattan", "specific": "Citicorp Center (book spelling CitiCorp) and corner church", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book gives 1967 as the build date, which requires verification (construction ran later); church name not given in book text"}, "additionalResearch": [{"claim": "Citigroup Center (formerly Citicorp Center; 153 East 53rd Street / 601 Lexington Avenue) began construction in April 1974 and opened on 12 October 1977. St. Peter's Lutheran Church occupied the corner of the site. The wind-load problem was found in 1978 after engineering student Diane Hartley's inquiry led William LeMessurier to recalculate: Wikipedia gives June 1978; the Wikipedia crisis article mirror gives July 1978 with key recalculations on 24 July 1978. Wikipedia coordinates 40.75861, -73.97028.", "neighbourhood": "Midtown Manhattan", "coordinates": {"lat": 40.75861, "lng": -73.97028, "source": "Wikipedia infobox", "status": "externally sourced (single source)"}, "sources": [{"title": "Citigroup Center (Wikipedia)", "url": "https://en.wikipedia.org/wiki/Citigroup_Center"}, {"title": "Citicorp Center engineering crisis (Wikiwand mirror)", "url": "https://www.wikiwand.com/en/articles/Citicorp_Center_engineering_crisis"}, {"title": "99% Invisible episode page on the Citicorp Center story", "url": "https://99percentinvisible.org/?p=2471"}], "verification": "the sources agree on 1977 completion and 1978 discovery but disagree on June vs July 1978; they do not support the book's '1967' build date (construction began 1974); the book's date is left unchanged in Layer A and flagged", "addresses": ["Book gives 1967 as the build date, which requires verification (construction ran later); church name not given in book text"], "layer": "B", "accessed": "2026-11-17"}], "bookCitedSources": ["Bellows, Alan. “A Potentially Disastrous Design Error.” Damn Interesting", "(blog), April 12, 2006.", "Morgenstern, Joe. “City Perils: The Fifty-Nine Story Crisis.” The New", "Yorker, May 29, 1995.", "“OEC—Addendum: The Diane Hartley Case.” The Online Ethics Center", "website, accessed March 13, 2019.", "Werner, Joel, and Sam Greenspan. “110: Structural Integrity.” 99% Invisible", "(podcast and MP3 audio), April 15, 2014."], "relatedDiscoveries": ["DISC-067", "DISC-070", "DISC-066"], "media": [], "arPotential": true, "autoKeywords": ["New York City", "Managing Crises", "New Yorkers", "Midtown Manhattan", "Hugh Stubbins", "William Le", "V-shaped", "Hartley", "Citicorp Center’s", "Citicorp Center"], "verificationStatus": "book-reviewed-full-text; layer-B-researched"}, {"id": "DISC-069", "title": "Redefining Skylines", "originalTitle": "Perspective Matters: Redefining Skylines", "kicker": "Perspective Matters", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Towers", "bookReference": {"pdfPages": [216, 218], "printedPages": null, "bibliographyPdfPage": 405, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 464, "trailingNonStoryText": []}, "bookContent": {"summary": "San Francisco's Transamerica Pyramid, proposed in the late 1960s, was opposed by Modernist architects, AIA chapter members, neighbors who sued and protestors wearing pyramid-shaped hats, partly for its 200 feet of unused apex and unusual shape ('second-class Space Needle'). It was built anyway; it sits at the end of Columbus Avenue's 45-degree diagonal, which gives views of its edge. Critics warmed to it, and it stands out against conventional steel-and-glass towers.", "function": "A controversial tower that redefined a skyline.", "historicalContext": "Late 1960s plans; Modernism vs Postmodernism.", "keyTakeaway": "Time and context can reverse architectural judgments.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "View it from Columbus Avenue as well as from the grid streets.", "visualClues": ["Pyramidal form with unused top", "Odd window shapes"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "San Francisco", "country": "United States", "neighbourhood": "Financial District", "specific": "Transamerica Pyramid, at Columbus Avenue terminus", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["“History.” Transamerica Pyramid Center website, accessed October 20, 2019.", "King, John. “An ode to the Transamerica Pyramid as a new tallest tower", "rises.” San Francisco Chronicle, October 7, 2016.", "King, John. “Pyramid’s steep path from civic eyesore to icon.” SFGate", "website, December 27, 2009.", "Mars, Roman. “2: 99% 180.” 99% Invisible (podcast and MP3 audio),", "September 9, 2010."], "relatedDiscoveries": ["DISC-067", "DISC-070", "DISC-071"], "media": [], "arPotential": true, "autoKeywords": ["Transamerica Pyramid", "San Francisco", "Redefining Skylines", "Postmodernist", "Transamerica Corporation", "American Institute of Architects", "Modernist-leaning", "Needle", "San Francisco’s", "Columbus Avenue"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-070", "title": "Engineering Icons", "originalTitle": "Beyond Above: Engineering Icons", "kicker": "Beyond Above", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Towers", "bookReference": {"pdfPages": [218, 220], "printedPages": null, "bibliographyPdfPage": 406, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 700, "trailingNonStoryText": []}, "bookContent": {"summary": "Taipei 101 (508 m, 1,667 ft; supertall means over 300 m) was briefly the world's tallest, passed by the Burj Khalifa in 2010. Architect C. Y. Lee modeled it on a pagoda with gold coins and dragons. Its visible tuned mass damper, a 41-stack steel gold sphere weighing about as much as 132 elephants hung on four cable bundles, is a star attraction branded by Sanrio as Damper Babies (faces spell 101). Superlatives (biggest damper, fastest elevators, tallest LEED-certified) and attractions help supertalls stay notable.", "function": "Branding structural safety.", "historicalContext": "Taipei 101 world's tallest until 2010.", "keyTakeaway": "When height alone is no longer special, design and experience carry fame.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for visible dampers, observation decks and mascots in supertall towers.", "visualClues": ["Pagoda-like stacked tiers", "Golden pendulum damper"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Taipei", "country": "Taiwan", "neighbourhood": null, "specific": "Taipei 101", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["“Experience the Skyslide at OUE Skyspace Los Angeles.” Discover Los", "Angeles website, accessed February 2, 2020.", "Poon, Dennis, Shaw-Song Shieh, Leonard Joseph, and Ching-Chang Chang.", "“Structural Design of Taipei 101, World’s Tallest Building.” Research", "paper presented at the Council on Tall Buildings and Urban Habitat 2004", "Seoul Conference, October 10–13.", "“Taipei Financial Center (Taipei 101).” C. Y. Lee & Partners website,", "accessed October 22, 2019.", "Trufelman, Avery. “201: Supertall 101.” 99% Invisible (podcast and MP3", "audio), April 19, 2016."], "relatedDiscoveries": ["DISC-068", "DISC-067", "DISC-071"], "media": [], "arPotential": false, "autoKeywords": ["Taipei", "Damper Babies", "Engineering Icons", "Sears Tower", "Chrysler Building", "Transamerica Pyramid", "Shanghai Tower", "Makkah Royal Clock", "Sanrio Company", "Hello Kitty"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-071", "title": "Street Canyons", "originalTitle": "Grouped Dynamics: Street Canyons", "kicker": "Grouped Dynamics", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Towers", "bookReference": {"pdfPages": [220, 224], "printedPages": null, "bibliographyPdfPage": 406, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 798, "trailingNonStoryText": ["Trailing caption: 'Contrasting addition to the Royal Ontario Museum in Toronto' (figure caption or section teaser at the end of the spread; not story text)"]}, "bookContent": {"summary": "Single towers can cause street-level problems: Manchester's Beetham Tower blade hums in wind; Leeds's Bridgewater Place funnels 80-mph gusts (a 2011 flipped truck killed a pedestrian; owners paid over $1 million); London's 20 Fenchurch Street (Walkie-Talkie) reflected sunlight that melted car parts and fried an egg. Clusters create street canyons with wind, heat, smog and heat-island effects, and light effects like Manhattan Solstice (Manhattanhenge, as named by Neil deGrasse Tyson).", "function": "Microclimate side effects of tall buildings.", "historicalContext": "2006 Beetham Tower; 2011 Leeds accident.", "keyTakeaway": "City-scale effects cannot be read from single building designs.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Check wind baffles, shading layers and sunset alignment down cross streets.", "visualClues": ["Wind baffles at tower base", "Concave glass facade"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "Manhattan", "specific": "Manhattanhenge on cross streets", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Manchester", "country": "United Kingdom", "neighbourhood": null, "specific": "Beetham Tower", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Leeds", "country": "United Kingdom", "neighbourhood": null, "specif  on adjacent structure' (figure caption or section teaser at the end of the spread; not story text)"]}, "bookContent": {"summary": "Carnuntum, a Roman city and fort on the Danube near Vienna, is an open-air museum with ruins, stabilized and rebuilt buildings. The partly collapsed Heidentor (Heathen's Gate), a quadrifrons triumphal monument thought built by Constantius II (an Arian Christian), was medieval lore as a pagan giant's tomb. A transparent panel with a line drawing lets visitors overlay its original shape on the ruin, a cheap visual alternative to reconstruction. Single-period restoration collapses complex histories.", "function": "Low-tech overlay that shows past and present together.", "historicalContext": "Roman era; medieval misreading.", "keyTakeaway": "Preservation choices decide which part of a place's story is told.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for transparent panels, outlines and plaques that explain ruins.", "visualClues": ["See-through panel with line drawing in front of a ruin"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Carnuntum", "country": "Austria", "neighbourhood": null, "specific": "Heidentor (Heathen's Gate)", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Downson, Thomas. “Three Ingenious Achaeological ‘Re-Constructions.’”", "Archaeology Travel (blog), accessed October 2, 2019.", "Kirsch, Jonathan. God Against the Gods: The History of the War Between", "Monotheism and Polytheism. New York: Viking, 2004.", "Norris, Shawn T. “Carnuntum—A City of Emperors.” Rome Across Europe", "website, October 4, 2015."], "relatedDiscoveries": ["DISC-077", "DISC-078", "DISC-081", "DISC-082"], "media": [], "arPotential": true, "autoKeywords": ["Overlapping Narratives", "Danube River", "Austria", "Vienna", "Emperor Constantius", "Middle Ages", "Heidentor", "Heathen’s Gate", "Ironically", "Constantius"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-077", "title": "Historic Preservation", "originalTitle": "Landmark Ruling: Historic Preservation", "kicker": "Landmark Ruling", "chapter": "ARCHITECTURE", "chapterNumber": 4, "subcategory": "Heritage", "bookReference": {"pdfPages": [235, 237], "printedPages": null, "bibliographyPdfPage": 409, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 740, "trailingNonStoryText": []}, "bookContent": {"summary": "New York's original Pennsylvania Station (McKim, Mead & White, 1910, Beaux Arts, Doric columns, glass-arched hall) shamed the Vanderbilts into rebuilding Grand Central. It decayed in the Jet Age and highway era; owners sold air rights for Madison Square Garden, and demolition began in 1963 despite a small AGBANY march ('Polish, don't demolish!'); stone was dumped in a New Jersey swamp. The dismal 1968 replacement led Vincent Scully to write 'one entered the city like a god; one scuttles in now like a rat.' Mayor Wagner created the first Landmarks Preservation Commission; when Grand Central was threatened in 1968 (with Jacqueline Kennedy Onassis supporting preservation), the Supreme Court upheld the landmark law in 1978. A patch of soot is left intentionally uncleaned in Grand Central's ceiling.", "function": "Origin story of NYC preservation law.", "historicalContext": "1910 Penn Station; 1963 demolition; 1965 Landmarks law; 1978 Supreme Court.", "keyTakeaway": "A lost landmark helped save others.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Layer B opportunity: Landmarks law date; Grand Central soot patch location"]}, "observation": {"whatToLookFor": "Look at Grand Central's ceiling for the uncleaned soot patch and compare with Penn Station.", "visualClues": ["Uncleaned soot patch on vaulted ceiling", "Madison Square Garden above Penn Station"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "Midtown Manhattan", "specific": "Penn Station and Madison Square Garden", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "New York City", "country": "United States", "neighbourhood": "Midtown Manhattan", "specific": "Grand Central Terminal", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": "Layer B opportunity: Landmarks law date; Grand Central soot patch location"}, "additionalResearch": [{"claim": "New York Penn Station is in Midtown Manhattan, bounded by Seventh and Ninth Avenues and 31st and 33rd Streets (Wikipedia coordinates 40.750638, -73.993899). Demolition of the original station's above-ground head house began in October 1963.", "neighbourhood": "Midtown Manhattan", "coordinates": {"lat": 40.750638, "lng": -73.993899, "source": "Wikipedia infobox (current station)", "status": "externally sourced (single source)"}, "sources": [{"title": "New York Penn Station (Wikipedia)", "url": "https://en.wikipedia.org/wiki/New_York_Penn_Station"}], "verification": "single secondary source; Grand Central Terminal (also named in the book) not checked", "layer": "B", "accessed": "2026-11-17"}], "bookCitedSources": ["“About LPC.” The New er": 5, "subcategory": "Delineations", "bookReference": {"pdfPages": [258, 261], "printedPages": null, "bibliographyPdfPage": 413, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 844, "trailingNonStoryText": []}, "bookContent": {"summary": "Washington, DC's original boundary stones (Residence Act 1790; surveyor Andrew Ellicott; one per mile on a ten-mile diamond; inscribed JURISDICTION OF THE UNITED STATES and MARYLAND or VIRGINIA) are the oldest federal monuments. The 1794 ceremonial stone sits at Jones Point. Fred Woodward mapped them in 1905 and the Daughters of the American Revolution added iron cages. Several stones were lost, buried (Southeast 8, found eight feet down in the 1990s and replaced in 2016), or hit by a car (Southeast 6). All 36 remaining stones were listed on the National Register in the 1990s; boundaries and ownership complicate care.", "function": "Visible edge of a capital city.", "historicalContext": "1790 Residence Act; 1794; 1905 Woodward; 1990s NRHP.", "keyTakeaway": "Invisible borders leave physical traces that require care.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Use a phone map to find boundary stones along DC streets.", "visualClues": ["Stone inside iron cage", "Inscription JURISDICTION OF THE UNITED STATES"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Washington, D.C.", "country": "United States", "neighbourhood": null, "specific": "boundary stones; Jones Point stone (Alexandria, Virginia)", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null},
