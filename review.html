rces": ["“Errors on Road Maps.” Petrol Maps website, 2006. Inaccessible.", "Green, John. Paper Towns. New York: Dutton Books, 2008.", "Krulwich, Robert. “An Imaginary Town Becomes Real, Then Not. True", "Story.” Krulwich Wonders (NPR), March 18, 2014.", "Youssef, Sharif. “242: Mini-Stories: Volume 2: Fictitious Entry by Sharif.”", "99% Invisible (podcast and MP3 audio), December 19, 2017.", "Zaltzman, Helen. “7: Mountweazel.” The Allusionist (podcast and MP3", "audio), March 25, 2015."], "relatedDiscoveries": ["DISC-097", "DISC-093", "DISC-099"], "media": [], "arPotential": false, "autoKeywords": ["General Drafting Corporation", "Rand Mc", "Fictitious Entries", "Korzybski", "New York State", "Roscoe", "Beaverkill", "Pennsylvania", "New Columbia Encyclopedia", "Lillian Virginia Mountweazel"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-097", "title": "Null Island", "originalTitle": "Misplaced Locations: Null Island", "kicker": "Misplaced Locations", "chapter": "GEOGRAPHY", "chapterNumber": 5, "subcategory": "Designations", "bookReference": {"pdfPages": [288, 289], "printedPages": null, "bibliographyPdfPage": 418, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 428, "trailingNonStoryText": []}, "bookContent": {"summary": "Null Island (0 degrees N, 0 degrees E in the South Atlantic) is where corrupted GIS data lands. A Kansas farm suffered hundreds of millions of misplaced points from a mapping company's default US location (accused of theft and visited by marshals) until the default was moved into water. Enthusiasts embrace Null Island with a flag and fake history; the real site has Station 13010, 'Soul', a PIRATA weather buoy.", "function": "Geographic data errors and their human costs.", "historicalContext": "Early 2000s Kansas farm.", "keyTakeaway": "Digital maps default to places, sometimes onto real people.", "readDepth": "full story text read and checked against the book PDF page pterNumber": 5, "subcategory": "Designations", "bookReference": {"pdfPages": [289, 292], "printedPages": null, "bibliographyPdfPage": 419, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 498, "trailingNonStoryText": []}, "bookContent": {"summary": "Place names tell stories (Cape Disappointment, Hopeless Way; Damien Rudd's Sad Topographies). Second is the most common US street name, then Third, First, Fourth, Fifth sixth. A long glossary explains road suffixes (road, street, avenue, boulevard, way, lane, drive, terrace, place, court, highway, freeway, expressway, interstate, turnpike, beltway, parkway, causeway). Tucson's 'stravenue' (street + avenue) for diagonal roads was coined in 1948.", "function": "Decode street-name conventions.", "historicalContext": "1948 stravenue.", "keyTakeaway": "Suffixes encode road type; naming is a chance for character.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Read the suffix on a street sign and compare with the glossary.", "visualClues": ["Street signs reading Stra"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Tucson", "country": "United States", "neighbourhood": null, "specific": "stravenues", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Edwards, Phil, and Gina Barton. “How streets, roads, and avenues are", "different.” Vox website, November 14, 2016.", "Kelly, Andrea. “‘Stravenue’: Is it unique to Tucson?” Road Runner blog at", "Tucson.com, March 3, 2008.", "“Most Common U.S. Str 50,000 bodies to Colma; many headstones were reused around the city, at Ocean Beach (erosion control) and Buena Vista Park (trails and gutters).", "function": "Links cemeteries, parks and relocated dead.", "historicalContext": "Early 1800s; early 1900s SF moratorium.", "keyTakeaway": "Parks owe a design debt to cemeteries and headstones are hidden in cities.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for old headstones reused in walls, gutters and shorelines in San Francisco parks.", "visualClues": ["Headstone fragments as edging", "Mausoleum skyline"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Colma", "country": "United States", "neighbourhood": null, "specific": "necropolis town south of San Francisco", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "San Francisco", "country": "United States", "neighbourhood": null, "specific": "reused headstones at Ocean Beach and Buena Vista Park", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "New York City", "country": "United States", "neighbourhood": "Central Park", "specific": "inspired by Mount Auburn", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [{"claim": "Central Park was designed by Frederick Law Olmsted and Calvert Vaux (Greensward Plan, 1858); its first areas opened in late 1858 and it was completed in 1876. Wikipedia coordinates 40°46′56″N 73°57′55″W. The pag {"summary": "The High Line, a mile-and-a-half park on repurposed elevated rail on Manhattan's West Side, grew from Death Avenue freight deaths and the 1929 elevation plan; rail use fell in the 1960s, a foundation formed and the Trails Act was amended in 1983, and Mayor Giuliani signed a demolition order before Friends of the High Line won a design competition (hundreds of entries, even roller coasters and lap pools). It gave rise to nearby development (improvement or gentrification). Precedents and imitators: Olmsted's Emerald Necklace in Boston (1870s), London's failed Garden Bridge, Chicago's 606, a Los Angeles River greenway, rail trails in Minneapolis, Paris and Germany.", "function": "Case study of rail-to-park conversion.", "historicalContext": "Late 1800s-early 1900s Death Avenue; 1929; 1960s decline; 1983; 2000s park.", "keyTakeaway": "Linear parks diversify mobility and bring people together.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Layer B opportunity: High Line coordinates and open dates (book says started in the 2000s, no sections dated)"]}, "observation": {"whatToLookFor": "Walk the High Line and note where it passes between and through buildings and what it replaced.", "visualClues": ["Elevated rail with planted beds", "Seating and vendor spots", "Walkway through a building"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "West Side, Manhattan", "specific": "High Line", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Boston", "country": "United States", "neighbourhood": null, "specific": "Emerald Necklace", "precision": "exact-site", "source": "book text (full-text review)", "verification": ical value.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look at which trees line your streets and who planted them.", "visualClues": ["Palm-lined boulevard", "Warning tags on small evergreens"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Los Angeles", "country": "United States", "neighbourhood": null, "specific": "street palms", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Lincoln, Nebraska", "country": "United States", "neighbourhood": null, "specific": "University of Nebraska campus", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Carroll, Rory. “Los Angeles’ legendary palm trees are dying—and few will", "be replaced.” The Guardian, September 29, 2017.", "Dumpelmann, Sonja. “Not so long ago, cities were starved for trees. That", "inspired a fight against urban warming.” PBS NewsHour, January 25,", "2019.", "Farmer, Jared. Trees in Paradise: A California History. New York: W. W.", "Norton Company, 2013.", "Greenspan, Sam. “155: Palm Reading.” 99% Invisible (podcast and MP3", "audio), March 3, 2015.", "Pinkerton, James. “Palm tree poachers plaguing the Valley.” Houston", "Chronicle, May 30, 2004.", "Schulz, Bailey. “Campus evergreens sprayed with fox urine to prevent theft.”", "Daily Nebraskan, October 8, 2015."], "relatedDiscoveries": ["DISC-103", "DISC-104", "DISC-043", "DISC-051"], "media": [], "arPotential": false, "autoKeywords": ["Los Angeles", "California", "Christmas", "Street Trees", "Jeffrey Culbertson", "Daily Nebraskan", "I’ll", "Arecaceae", "Texas", "American Midwest"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-103", "title": "Owned Backyards", "originalTitle": "Lawn Enforcement: Owned Backyards", "kicker": "Lawn Enforcement", "chapter": "GEOGRAPHY", "chapterNumber": 5, "subcategory": "Landscapes", "bookReference": {"pdfPages": [301, 303], "printedPages": null, "bibliographyPdfPage": 421, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 942, "trailingNonStoryText": []}, "bookContent": {"summary": "American lawns are enforced by neighbors and governments: painted brown grass; a Hudson, Florida retiree jailed for a brown lawn; Dunedin's code board fining $500/day. Lawns derive from Italian Renaissance landscape paintings and English elite status (Paul Robbins's Lawn People), and A. J. Downing's 1850 'order and culture'. Grass is the most irrigated US crop (about three times as many lawn acres as irrigated corn per Cristina Milesi); California's 2015 drought order (Jerry Brown) and xeriscaping push change, and Benjamin Vogt argues lawns displace pollinator habitat.", "function": "Exposes lawn norms and costs.", "historicalContext": "Renaissance origins; 1850 Downing; 2015 California drought.", "keyTakeaway": "Lawns are a moral and class symbol with ecological costs.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Notice lawn vs xeriscape and painted grass.", "visualClues": ["Painted green lawn", "Xeriscaped yard"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Hudson, Florida", "country": "United States", "neighbourhood": null, "specific": "jailed homeowner", "precision": "city", "source": "book text (full-text revie ": ["Donnell", "Manhattan", "Fish Stories", "Canal Street", "Empire State Building", "Sunfish Pond", "Across", "Brynn O’", "Burying", "Streams"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-107", "title": "Unloved Doves", "originalTitle": "Home to Roost: Unloved Doves", "kicker": "Home to Roost", "chapter": "GEOGRAPHY", "chapterNumber": 5, "subcategory": "Synanthropes", "bookReference": {"pdfPages": [314, 316], "printedPages": null, "bibliographyPdfPage": 423, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 401, "trailingNonStoryText": []}, "bookContent": {"summary": "Pigeons were once aristocratic: domesticated in the Middle East, spread by the Romans (Tuscan villa pigeon houses), brought to Canada in the 1600s and exchanged as gifts by dignitaries. As they became common they lost status, and 'pigeon' and 'dove' diverged in connotation. Anti-pigeon spikes, wires, netting and electrified strips mostly move birds elsewhere. Pigeons are a human construct, bred, spread and fed.", "function": "Reframes pigeons as a human-made problem.", "historicalContext": "Roman era; 1600s.", "keyTakeaway": "Urban pests are made by human choices.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look at deterrents on ledges and where pigeons relocate.", "visualClues": ["Spikes on a ledge", "Netting"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "not place-specific", "places": [], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Bryce, Emma. “Why Are There So Many Pigeons?” Live Science website,", "October 27, 2018.", "Clayton, Indya. “Spikes on branches of tree in Oxford to stop bird droppings", "on parked cars.” Oxford Mail, April 24, 2019.", "Johnson, Nathanael. Unseen City: The Majesty of Pigeons, the Discreet", "Charm of Snails & Other Wonders of the Urban Wilderness. New York:", "Rodale Books, 2016.", "Mars, Roman. “210: Unseen City: Wonders of the Urban Wilderness.” 99%", "Invisible (podcast and MP3 audio), April 26, 2016.", "Primm, Arallyn. “A History of the Pigeon.” Mental Floss (blog), February 3,", "2014."], "relatedDiscoveries": ["DISC-111", "DISC-105", "DISC-108"], "media": [], "arPotential": false, "autoKeywords": ["Europe", "Unloved Doves", "Middle East", "Romans", "Roman", "Tuscan", "Canada", "United States", "Columbidae", "Pigeon"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-108", "title": "Trash Pandas", "originalTitle": "Raccoon Resistance: Trash Pandas", "kicker": "Raccoon Resistance", "chapter": "GEOGRAPHY", "chapterNumber": 5, "subcategory": "Synanthropes", "bookReference": {"pdfPages": [316, 318], "printedPages": null, "bibliographyPdfPage": 424, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 728, "trailingNonStoryText": []}, "bookContent": {"summary": "In 2018 the 'MPR raccoon' climbed a St. Paul, Minnesota office tower, using aggregate in precast concrete panels, sills and a rounded corner, while media lights pushed her upward. Early-1900s psychologists found raccoons solve puzzle boxes by trial, observation and curiosity. Toronto's 2016 raccoon-resistant compost bins (big wheels, rodent-resistant rim, German locking mechanism) were tested on dozens of raccoons and rolled out by the hundreds of thousands, though videos show some raccoons defeating them. Raccoons now live across Europe, Japan and the Caribbean, introduced deliberately and inadvertently.", "function": "Raccoons as test of urban design.", "historicalContext": "Early 1900s research; 2016 Toronto bins; 2018 St. Paul climb.", "keyTakeaway": "Urban design shapes animal adaptation.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Check the lock design on bins and what raccoons use to climb.", "visualClues": ["Locked green bin with large wheels", "Rough aggregate facade"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "St. Paul", "country": "United States", "neighbourhood": null, "specific": "downtown office tower (MPR raccoon)", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Toronto", "country": "Canada", "neighbourhood": null, "specific": "raccoon-resistant bins", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Bowler, Jacinta. “Raccoons Have Passed an Ancient Intelligence Test by", "Knocking It Over.” Science Alert website, October 23, 2017.", "Dempsey, Amy. “Toronto built a better green bin and—oops—maybe a", "smarter raccoon.” Toronto Star, August 30, 2018.", "Hsu, Jeremy. “Why Raccoons Didn’t Cut It as Lab Rats.” Live Science", "website, September 15, 2010.", "Kohlstedt, Kurt. “MPR Raccoon: Exploring the Urban Architecture Behind", "an Antisocial Climber.” 99% Invisible (blog), June 15, 2018.", "Main, Douglas. “Raccoons are spreading across Earth—and climate change", "could help.” National Geographic website, July 29, 2019.", "Mingle, Katie. “330: Raccoon Resistance.” 99% Invisible (podcast and MP3", "audio), November 27, 2018.", "Nelson, Tim. “Social climber: Raccoon scales St. Paul skyscraper, captures", "internet.” MPR News, June 12, 2018.", "Pettit, Michael. “Raccoon intelligence at the borderlands of science.” Monitor", "on Psychology 41, no. 10 (2010): 26."], "relatedDiscoveries": ["DISC-105", "DISC-107", "DISC-109"], "media": [], "arPotential": false, "autoKeywords": ["Trash Pandas", "Minnesota", "Minnesota Public Radio", "Minnesota’s Twin Cities", "North American", "Toronto", "Toronto’s", "Amy Dempsey", "Toronto Star", "German-made"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-109", "title": "Wildlife Corridors", "originalTitle": "Unmanned Lands: Wildlife Corridors", "kicker": "Unmanned Lands", "chapter": "GEOGRAPHY", "chapterNumber": 5, "subcategory": "Synanthropes", "bookReference": {"pdfPages": [318, 321], "printedPages": null, "bibliographyPdfPage": 424, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 438, "trailingNonStoryText": ["Trailing text 'Discouraging spikes, guerrilla signage, and open hydrant' is a section teaser (not story text)"]}, "bookContent": {"summary": "The Iron Curtain's Cold War no-man's land became an accidental wildlife refuge; after the Berlin Wall fell, conservationists proposed a European greenbelt. Wildlife corridors are infrastructure for non-humans: crab bridges, squirrel wires, fish ladders and overpasses for mountain lions. The US has nearly two million barriers to migratory fish; fish cannons are quick fixes that cannot reconnect habitats. People need to see cities and nature as one ecosystem.", "function": "Designing for non-human travel.", "historicalContext": "Cold War; post-1989 greenbelt.", "keyTakeaway": "Cities need corridors, not just quick fixes.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for animal crossings, ladders and bridges.", "visualClues": ["Overpass covered in plants over a highway", "Fish ladder"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Europe", "country": "Europe", "neighbourhood": null, "specific": "Iron Curtain greenbelt", "precision": "region", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["“Adult Upstream Passage on the West Coast.” NOAA Fisheries website,", "updated September 27, 2019.", "“European Green Belt Initiative.” European Green Belt website, accessed", "January 28, 2020.", "FitzGerald, Emmett. “197: Fish Cannon.” 99% Invisible (podcast and MP3", "audio), January 26, 2016.", "Groves, Martha. “Caltrans proposes wildlife overpass on 101 Freeway.” Los", "Angeles Times, September 2, 2015.", "McKenna, Phil. “Life in the Death Zone.” PBS NOVA website, February 18,", "2015.", "Montgomery, David. King of Fish: The Thousand-Year Run of Salmon. New", "York: Basic Books, 2004.", "Rogers, SA. “Urban Rewilding: Reverse-Engineering Cities to Save Nature", "—and Ourselves.” WebUrbanist (blog), August 6, 2018.", "“Wildlife Corridors.” New South Wales Department of Environment and", "Conservation website, August 2004."], "relatedDiscoveries": ["DISC-105", "DISC-106", "DISC-108", "DISC-124"], "media": [], "arPotential": false, "autoKeywords": ["Wildlife Corridors", "East", "West", "Cold War", "Berlin Wall", "European", "Iron Curtain", "United States"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-110", "title": "Dubious Skateblockers", "originalTitle": "Loved Park: Dubious Skateblockers", "kicker": "Loved Park", "chapter": "URBANISM", "chapterNumber": 6, "subcategory": "Hostilities", "bookReference": {"pdfPages": [325, 327], "printedPages": null, "bibliographyPdfPage": 426, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 821, "trailingNonStoryText": []}, "bookContent": {"summary": "Philadelphia's LOVE Park (John F. Kennedy Plaza), designed by Edmund Bacon with Modernist plazas, marble benches, planters and ledges, became a skateboarding mecca from the 1980s (videos, a Tony Hawk game), though skating was illegal and the park was renovated in 2002 to be less skate-friendly; DC Shoes' $1 million offer was rejected. Bacon (92) skated through in support. In 2016 the mayor suspended the ban for five days before another renovation. Skate stoppers elsewhere include sea-creature sculptures on San Francisco's Embarcadero. Skatepark design borrows from LOVE Park.", "function": "Hostile design aimed at skaters and the skate culture that responded.", "historicalContext": "1960s park; 1980s-90s skating; 2002 renovation; 2016 last skate.", "keyTakeaway": "Users adapt spaces in ways designers did not intend.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for metal brackets and 'knobs' on ledges and rails.", "visualClues": ["Skate stoppers on ledges", "Ornamental sculptures as skate deterrents"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Philadelphia", "country": "United States", "neighbourhood": null, "specific": "LOVE Park (JFK Plaza)", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "San Francisco", "country": "United States", "neighbourhood": null, "specific": "Embarcadero skate stoppers", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Bracali, Anthony. “Thanks, Le Corbusier ( . . . from the skateboarders).”", "AnthonyBracali.com (website). Inaccessible.", "Madej, Patricia. “LOVE Park reopens after renovations.” Philadelphia", "Inquirer, May 30, 2018", "McQuade, Dan. “A Farewell: LOVE Park, Skateboard Mecca.” Philadelphia", "Magazine, February 12, 2016.", "Norton, Andrew. “71: In and Out of LOVE.” 99% Invisible (podcast and", "MP3 audio), January 23, 2013.", "“Philly mayor shows love to skateboarders, lifts ban in Love Park.” The", "Morning Call (Allentown, PA), February 10, 2016.", "Rafkin, Louise. “Sea Life Skate Stoppers.” New York Times, December 3,", "2011.", "“Rob Dyrdek/DC Shoes Foundation Skate Plaza.” City of Kettering", "Recreation Department website, accessed October 1, 2019."], "relatedDiscoveries": ["DISC-111", "DISC-112", "DISC-113", "DISC-120"], "media": [], "arPotential": true, "autoKeywords": ["Park", "Edmund Bacon", "Philadelphia", "Modernists", "Dubious Skateblockers", "Thank", "Kevin Bacon", "John", "Plaza", "Modernist"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-111", "title": "Discouraging Spikes", "originalTitle": "Urine Trouble: Discouraging Spikes", "kicker": "Urine Trouble", "chapter": "URBANISM", "chapterNumber": 6, "subcategory": "Hostilities", "bookReference": {"pdfPages": [327, 329], "printedPages": null, "bibliographyPdfPage": 426, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 498, "trailingNonStoryText": []}, "bookContent": {"summary": "Tesco's 2014-era spikes outside a central London shop provoked protest (activists poured concrete; Mayor Boris Johnson called them 'ugly, self-defeating and stupid') and were removed within days. Defensive design includes anti-homeless spikes, horizontal urine spikes and deflectors (a Bank of England example), and Hamburg's St. Pauli hydrophobic paint ('Wir pinkeln zurueck'). An 1809 passage shows the idea is old. Such deterrents are widespread but overlooked until noticed.", "function": "Hostile architecture vocabulary.", "historicalContext": "1809 passage; modern Tesco incident (book gives no year).", "keyTakeaway": "Defensive design is common but contested.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book gives no date for the Tesco spikes"]}, "observation": {"whatToLookFor": "Look for spikes, studs, slanted shelves and wall coatings.", "visualClues": ["Metal spikes at a doorway", "Angled deflector in an alcove", "Anti-pee sign on painted wall"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "London", "country": "United Kingdom", "neighbourhood": null, "specific": "Tesco spikes; Bank of England deflector", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Hamburg", "country": "Germany", "neighbourhood": "St. Pauli", "specific": "anti-urination paint", "precision": "neighbourhood", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book gives no date for the Tesco spikes"}, "additionalResearch": [], "bookCitedSources": ["Halliday, Josh. “Tesco to remove anti-homeless spikes from Regent Street", "store after protests.” The Guardian, June 12, 2014.", "Jackson, Lee. “Urine Deflectors in Fleet Street.” The Cat’s Meat Shop (blog),", "July 23, 2013.", "McAteer, Oliver. “‘Anti-homeless’ spikes are ‘ugly, self-defeating and", "stupid’, says Boris Johnson.” Metro (UK), June 9, 2014.", "Nelson, Sara C. “Anti-Homeless Spikes Outside Tesco", "Vandalised with Concrete.” Huffington Post, June 12, 2014.", "“On Human Exuviae and Soil Holes.” The Farmer’s Magazine 10 (1809).", "“Residents of Hamburg’s St Pauli nightclub district use pee-repellent paint", "against public urination.” Australian Broadcasting Corporation website,", "March 5, 2015.", "Rogers, SA. “Hostile Urbanism: 22 Intentionally Inhospitable Examples of", "Defensive Design.” WebUrbanist (blog), January 1, 2018."], "relatedDiscoveries": ["DISC-112", "DISC-113", "DISC-107"], "media": [], "arPotential": true, "autoKeywords": ["London", "Discouraging Spikes", "Germany", "Hamburg", "Don’t Pee Here", "Pee Back", "In London", "Bank of England", "Tesco’s", "Boris Johnson"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-112", "title": "Discomforting Seats", "originalTitle": "Obstinate Objects: Discomforting Seats", "kicker": "Obstinate Objects", "chapter": "URBANISM", "chapterNumber": 6, "subcategory": "Hostilities", "bookReference": {"pdfPages": [329, 331], "printedPages": null, "bibliographyPdfPage": 427, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 468, "trailingNonStoryText": []}, "bookContent": {"summary": "Selena Savic and Gordan Savicic argue unpleasant design succeeds when discomfort is the point: benches with armrests between seats, leaning benches at bus stops, rumored fifteen-minute chairs. The Camden bench by Factory Furniture is an angular concrete lump that resists sleeping, drug stashing, skateboarding (varying edge heights), litter, theft (bag recesses) and graffiti (coating), and can serve as a barrier. The most common hostile design is the absence of seating, paired with sit-lie ordinances.", "function": "Catalog of anti-sitting design.", "historicalContext": "Not dated.", "keyTakeaway": "Discomfort can be the function.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look at benches for dividers, tilts and lumps; notice where there are no seats.", "visualClues": ["Bench wit r": 6, "subcategory": "Hostilities", "bookReference": {"pdfPages": [331, 332], "printedPages": null, "bibliographyPdfPage": 427, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 482, "trailingNonStoryText": []}, "bookContent": {"summary": "Street lighting served law and order as well as safety: Roman oil lanterns, Beijing bamboo gas pipes, 1400s-1500s lamp mandates, required torches in Europe, and a 1667 Paris police lieutenant general's permanent lighting (resented; revolutionaries smashed lamps; 'A la lanterne!'). Jane Jacobs's 'eyes on the street' is cited. Modern dissuasive lighting includes uncomfortably bright lights, pink lights in Mansfield, England that highlight blemishes, blue restroom lights in the UK to hide veins, and blue lights tested in Japanese subway stations to reduce suicides.", "function": "Light as a tool of control.", "historicalContext": "1667 Paris; French Revolution; modern defensive lighting.", "keyTakeaway": "Illumination can reassure or exclude.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Notice color and brightness of lights in plazas and restrooms.", "visualClues": ["Pink-tinted lights", "Blue-lit restroom"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Paris", "country": "France", "neighbourhood": null, "specific": "1667 street lighting decree", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Mansfield", "country": "United Kingdom", "neighbourhood": null, "specific": "pink lights", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinat yText": []}, "bookContent": {"summary": "Businesses play classical music outside entrances to deter youths, and the Mosquito, invented in 2005 by Howard Stapleton (inspired by factory noise only he heard and his daughter's harassment in Barry, South Wales), emits high frequencies audible mostly to those under about 25. Critics warn of hearing damage to young children and effects on people with tinnitus or autism; it has been banned in some places.", "function": "Sound as targeted deterrent.", "historicalContext": "2005 Mosquito.", "keyTakeaway": "Targeted deterrents affect many groups.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Listen for unusual high-pitched tones or loud classical music outside shops.", "visualClues": ["Small speaker box above a shop entrance"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Barry", "country": "United Kingdom", "neighbourhood": "South Wales", "specific": "origin of Mosquito idea", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Campbell, Sarah. “Now crime gadget can annoy us all.” BBC News,", "December 2, 2008.", "Conan, Neal. “Mosquito Targets Teens with Audio Repellent.” Talk of the", "Nation (NPR), September 1, 2010.", "“EU rejects bid to ban Mosquito.” The Herald (Plymouth, UK), September", "14, 2008.", "Lawton, B. W. “Damage to human hearing by airborne sound of very high", "frequency or ultrasonic frequency.” An Institute of Sound and Vibration", "Research report for the UK’s Health and Safety Executive, 2001.", "Lyall, Sarah. “What’s the Buzz? Rowdy Teenagers r": "Guerrilla Fixation", "chapter": "URBANISM", "chapterNumber": 6, "subcategory": "Interventions", "bookReference": {"pdfPages": [338, 340], "printedPages": null, "bibliographyPdfPage": 429, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 718, "trailingNonStoryText": []}, "bookContent": {"summary": "Artist Richard Ankrom, after missing a Los Angeles freeway exit, secretly installed a replica I-5 North exit sign on the 110 on August 5, 2001, matching dimensions, colors, typeface per the California MUTCD, even smog-grey paint, in work clothes with a fake Caltrans truck. It passed Caltrans inspection and stayed eight more years. Others: a Reno playground fixer, a Baltimore crosswalk painter, arrests in Muncie and Vallejo, and New York's Efficient Passenger Project subway wayfinding signs which the MTA removed, fearing overcrowding in train cars.", "function": "Guerrilla public service in official clothing.", "historicalContext": "2001 Ankrom sign; passed 2002 inspection.", "keyTakeaway": "Authorities respond to unsanctioned fixes inconsistently.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look at transit signs and exits and imagine a missing one.", "visualClues": ["Subway signs mimicking MTA style"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Los Angeles", "country": "United States", "neighbourhood": null, "specific": "Ankrom's sign over the 110 freeway", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "New York City", "country": "United States", "neighbourhood": null, "specific": "Efficient Passenger Project signs in the subway (removed)", "precision": "city", "sou ianteng redesigned confusing Los Angeles parking signs, focusing on when and how long you can park, matched to official sizes and colors, getting a 60% improvement in compliance and inspiring cities like Brisbane. Matt Tomasulo zip-tied walking-time signs in Raleigh, North Carolina (e.g., 7-minute walk to Raleigh Central Cemetery) to encourage walking; the city relented after pressure, and the design spread. Both are tactical urbanism, 'better to seek forgiveness than permission'.", "function": "Tactical urbanism through signage.", "historicalContext": "Not dated in book.", "keyTakeaway": "Small trials can change policy.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for walking-time signs and decode parking-sign stacks.", "visualClues": ["Stacked parking signs", "Walking-minute signs on poles"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Los Angeles", "country": "United States", "neighbourhood": null, "specific": "parking signs", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Raleigh", "country": "United States", "neighbourhood": null, "specific": "Walk [Your City] signs", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Badger, Emily. “Raleigh’s Guerrilla Wayfinding Signs Deemed Illegal.”", "CityLab (blog), February 27, 2012.", "Lydon, Mike, and Anthony Garcia. Tactical Urbanism: Short-term Action for", "Long-term Change. Washington, DC: Island Press, 2015.", "“Matt Tomasulo—From Pedestrian Campaigns to Pop-Ups, This “Civic", "Instigator’ Makes His Mark.” Next City (blog), March 25, 2015.", "Rogers, SA. “Guerrilla Wayfinding: User-Powered Signs Aid Exploration.”", "WebUrbanist (blog), September 30, 2013.", "Stinson, Liz. “A Redesigned Parking Sign So Simple That You’ll Never Get", "Towed.” Wired, July 15, 2014.", "Sylianteng, Nikki. “Parking Sign Redesign.” NikkiSylianTeng.com, accessed", "October 28, 2019."], "relatedDiscoveries": ["DISC-116", "DISC-118", "DISC-121", "DISC-123"], "media": [], "arPotential": true, "autoKeywords": ["Viral Signage", "Los Angeles", "Nikki Sylianteng", "Brisbane", "Australia", "Matt Tomasulo", "Raleigh", "North Carolina", "Sylianteng’s", "Tomasulo’s"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-118", "title": "Open Hydrants", "originalTitle": "Asking Permission: Open Hydrants", "kicker": "Asking Permission", "chapter": "URBANISM", "chapterNumber": 6, "subcategory": "Interventions", "bookReference": {"pdfPages": [342, 343], "printedPages": null, "bibliographyPdfPage": 430, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 513, "trailingNonStoryText": []}, "bookContent": {"summary": "Open fire hydrants are an NYC summer image that is illegal but has been sanctioned in various forms for a century. In the 1896 heat wave (1,000+ deaths in Lower Manhattan), Police Commissioner Theodore Roosevelt distributed free ice, suspended park-sleeping bans and hydrants were opened to cool streets. Uncontrolled hydrants can knock people down, lower water pressure and waste thousands of gallons per minute. In 2007 the DEP launched HEAT (Hydrant Education Action Team); a city-approved spray cap releases 20-25 gallons per minute and is free to adults 18+ at firehouses.", "function": "Case of guerrilla action becoming sanctioned practice.", "historicalContext": "1896 heat wave; 2007 HEAT program.", "keyTakeaway": "Dialogue between city and citizens can turn illegal habits into a sa ential": true, "autoKeywords": ["Open Hydrants", "Big Apple", "New York City", "East Coast", "Lower Manhattan", "Police Commissioner", "Theodore Roosevelt", "New York", "Department of Environmental Protection", "Hydrant Education Action Team"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-119", "title": "Embattled Boulders", "originalTitle": "Seeking Forgiveness: Embattled Boulders", "kicker": "Seeking Forgiveness", "chapter": "URBANISM", "chapterNumber": 6, "subcategory": "Interventions", "bookReference": {"pdfPages": [343, 345], "printedPages": null, "bibliographyPdfPage": 430, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 722, "trailingNonStoryText": []}, "bookContent": {"summary": "In late 2019 neighbors pooled $2,000 for 24 boulders placed on a sidewalk off Market Street in San Francisco's Mission District to deter illegal activity. Activists rolled them into the street; artist Danielle Baskin posted a Craigslist ad offering them free; DPW repeatedly hoisted them back, since the sidewalk space complied with ordinances. After chalk messages and fears of harassment, DPW director Mohammed Nuru said the boulders were removed at residents' request and stored at taxpayer expense. It sparked a larger conversation about crime and homelessness.", "function": "A contested, citizen-placed deterrent.", "historicalContext": "Late 2019.", "keyTakeaway": "Hostile interventions can backfire and spark debate.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book does not give an exact address"]}, "observation": {"whatToLookFor": "Look for scratches where objects once sat on sidewalks.", "visualClues": ["Large boulders on a sidewalk", "Chalk messages"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"
