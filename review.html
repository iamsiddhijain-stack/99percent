<script>const D=[{"id": "DISC-001", "title": "Utility Codes", "originalTitle": "Official Graffiti: Utility Codes", "kicker": "Official Graffiti", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Ubiquitous", "bookReference": {"pdfPages": [20, 23], "printedPages": null, "bibliographyPdfPage": 372, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 919, "trailingNonStoryText": []}, "bookContent": {"summary": "Color-coded paint, chalk and flags sprayed on streets mark buried utilities. A 1976 pipeline rupture on Venice Boulevard in Los Angeles helped spur DigAlert and, later, the national 811 number and Uniform Color Codes (red electric, orange telecom, yellow gas/oil/steam, green sewer, blue potable water, purple reclaimed water, pink temporary/unknown, white proposed excavation). Lines, arrows, numbers and abbreviations add detail, and conventions differ by country.", "function": "Temporary 'official graffiti' that tells diggers and locators what lies beneath the pavement.", "historicalContext": "June 1976 Venice Boulevard pipeline explosion (Los Angeles) -> DigAlert; FCC designated 811 in 2005; APWA Uniform Color Codes, revised by ANSI.", "keyTakeaway": "Street paint is a readable map of the hidden networks under your feet.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look down at roadwork sites and corners for sprayed colors, arrows, numbers and letters; match the color to the utility.", "visualClues": ["Sprayed colored lines and arrows on asphalt", "Orange lines with letters F and O flanking an arrow (fiber optic, per Burrington)", "Numbers beside D for depth (London)", "Looping infinity symbol marking a proposed project's start/end (London)", "Flags and white paint outlining a work area"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Los Angeles", "country": "United States", "neighbourhood": "Venice Boulevard", "specific": "1976 pipeline rupture and explosion", "precision": "named-street", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "New York City", "country": "United States", "neighbourhood": null, "specific": "orange telecom markings documented in Ingrid Burrington's Networks of New York", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "London", "country": "United Kingdom", "neighbourhood": null, "specific": "local utility marking examples (BBC article by Laurence Cawley)", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Burrington, Ingrid. Networks of New York: An Illustrated Field Guide to", "Urban Internet Infrastructure. Brooklyn, NY: Melville House, 2016.", "Cawley, Laurence. “What do those squiggles on the pavement actually", "mean?” BBC News, February 18, 2014.", "Common Ground Alliance. Best Practices: The Definitive Guide for", "Underground Safety & Damage Prevention. Alexandria, VA: CGA, 2018.", "Healy, Patrick. “Why You Should Call 811 Before Digging.” NBC Los", "Angeles, September 15, 2010.", "“Holocaust: Pipeline Blast Creates Horror Scene in L.A.” The Evening", "Independent (Los Angeles), June 17, 1976.", "Kohlstedt, Kurt. “Decoding Streets: Secret Symbols of the Urban", "Underground.” WebUrbanist (blog), February 27, 2014.", "UK Health and Safety Executive. Avoiding Danger from Underground", "Services. HS(G). 3rd ed. Bootle, UK: HSE Books, 2014."], "relatedDiscoveries": ["DISC-003", "DISC-004", "DISC-065"], "media": [], "arPotential": true, "autoKeywords": ["Los Angeles", "Utility Codes", "California", "June", "Venice Boulevard", "Southern California", "United States", "Damage Information Reporting Tool", "Uniform Color Codes", "American Public Works Association"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-002", "title": "Sidewalk Markings", "originalTitle": "Initialed Impressions: Sidewalk Markings", "kicker": "Initialed Impressions", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Ubiquitous", "bookReference": {"pdfPages": [23, 26], "printedPages": null, "bibliographyPdfPage": 372, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 1033, "trailingNonStoryText": []}, "bookContent": {"summary": "Sidewalks carry written history: Philadelphia's 'Space within building lines not dedicated' easement plaques mark private land the public may cross, guarding owners against adverse possession (21 years in Pennsylvania). Contractor stamps - with names, addresses, dates and union numbers - appear in Oakland, Berkeley (Paul Schnoor / Schnoor & Sons / Schnoor Bros.), and Chicago, where law required them. Calgary's misspelled street-name sidewalks (1909) were torn out; San Diego protects old stamps.", "function": "Legal boundary markers and contractor signatures embedded in concrete and metal.", "historicalContext": "Early-1900s concrete sidewalks; 1920s-postwar stamps; 1909 'Calgary Can't Spell'; 2016 PlanPhilly article by Jim Saksa; Chicago municipal stamp requirement.", "keyTakeaway": "Sidewalk marks record who built the city and who owns the ground you walk on.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Scan sidewalk corners and edges for metal plaques and stamped rectangles; read names, dates, addresses and union numbers.", "visualClues": ["Long thin metal plaques in a dashed line along a property edge", "Right-angled corner plaques", "Stamped contractor name, address, year inside a decorative border", "Street names pressed into sidewalk at intersections"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Philadelphia", "country": "United States", "neighbourhood": null, "specific": "easement plaques", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Oakland", "country": "United States", "neighbourhood": null, "specific": "early-1900s sidewalk stamps (Bay Area)", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Berkeley", "country": "United States", "neighbourhood": null, "specific": "Schnoor stamps", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Chicago", "country": "United States", "neighbourhood": null, "specific": "required contractor stamps", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Calgary", "country": "Canada", "neighbourhood": null, "specific": "1909 misspelled street names", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "San Diego", "country": "United States", "neighbourhood": null, "specific": "protected stamps", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Alden, Andrew. Oakland Underfoot: Fossils in the City’s Hardscape (blog).", "Accessed September 28, 2019.", "Cushing, Lincoln. “Sidewalk Contractor Stamps.” Berkeley Historical Plaque", "Project, 2012.", "Cushing, Lincoln. “Sidewalk Stamps Make Local History More Concrete.”", "Berkeley Daily Planet, June 14, 2005.", "Klingbeil, Annalise. “Concrete connection to Calgary’s past preserved in", "sidewalk stamps.” Calgary Herald, January 6, 2017.", "Saksa, Jim. “Streetsplainer: What the heck do those “The space between", "these lines not dedicated’ street markers mean?” WHYY (PBS), May 10,", "2016."], "relatedDiscoveries": ["DISC-001", "DISC-014"], "media": [], "arPotential": true, "autoKeywords": ["Philadelphia", "Sidewalk Markings", "American", "Space", "Property", "Plan", "Jim Saksa", "Saksa", "Pennsylvania", "California’s Bay Area"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-003", "title": "Breakaway Posts", "originalTitle": "Planned Failure: Breakaway Posts", "kicker": "Planned Failure", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Ubiquitous", "bookReference": {"pdfPages": [26, 28], "printedPages": null, "bibliographyPdfPage": 373, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 666, "trailingNonStoryText": []}, "bookContent": {"summary": "Posts that hold signs, lights and utility lines must withstand storms yet fail on purpose when hit by a vehicle. Slip-base systems join an upper and lower post with breakaway bolts so the upper post is knocked off while the base stays; inclined slip bases launch the sign up and over the car (but may fail if hit from an unexpected direction). Hinged connections let utility poles swing out of the way while cables hold them. Stop-sign posts use joined sections for the same idea.", "function": "Planned-failure road furniture that reduces crash harm and makes repair easier.", "historicalContext": "Not dated in the book.", "keyTakeaway": "Roadside safety depends on infrastructure engineered to break, not only on safer cars.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look at the base of sign posts for connector plates, bolts or a plate cover; check stop-sign posts for a joint just above ground.", "visualClues": ["Two post sections joined near ground level with a plate and bolts", "Tilted connector plate (inclined slip base)", "Insert post sleeved into an in-ground post on a stop sign"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "not place-specific", "places": [], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["American Association of State Highway and Transportation Officials.", "Roadside Design Guide. Washington, DC: AASHTO, 2011.", "Breakaway Timber Utility Poles. VHS, MPEG video. Federal Highway", "Administration. Washington, DC, 1989.", "McGee, Hugh W. Maintenance of Signs and Sign Supports: A Guide for", "Local Highway and Street Maintenance Personnel. Washington, DC:", "Office of Safety, Federal Highway Administration, January 2010."], "relatedDiscoveries": ["DISC-001", "DISC-004"], "media": [], "arPotential": true, "autoKeywords": ["Breakaway Posts"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-004", "title": "Emergency Boxes", "originalTitle": "A Little Safer: Emergency Boxes", "kicker": "A Little Safer", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Ubiquitous", "bookReference": {"pdfPages": [28, 32], "printedPages": null, "bibliographyPdfPage": 373, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 436, "trailingNonStoryText": ["Fake facade in front of a subway exhaust opening in Paris (photo caption at end of spread; relates to DISC-006)"]}, "bookContent": {"summary": "Knox Boxes (a brand name used generically, like Kleenex or Dumpster) are small rapid-entry safes at building entrances, with reflective red stripes. Firefighters unlock them with one master key or code to get that building's key, so they can enter without breaking in. Some boxes have control panels to cut power, gas or sprinklers; owners tie them to alarms and fire departments track master keys to manage the burglary risk.", "function": "Gives emergency responders fast, non-destructive access to buildings.", "historicalContext": "Not dated in the book.", "keyTakeaway": "Hidden in plain sight at eye level, these boxes turn from invisible to essential when seconds count.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Check beside building entrances at eye level for small boxes with reflective red stripes.", "visualClues": ["Small metal box at eye level beside an entrance", "Reflective red stripes", "Flip-open panel with switches (advanced types)"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "not place-specific", "places": [], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Harrell, Lauren. “41 Brand Names People Use as Generic Terms.” Mental", "Floss (blog), May 9, 2014.", "Jones, Cynthia. “Rapid Access: Gainesville Fire Department.” Knoxbox", "(website). The Knox Company, June 26, 2014.", "“Key Secure: Master Key Retention with Audit Trail.” Knoxbox (website).", "The Knox Company. Accessed September 28, 2019."], "relatedDiscoveries": ["DISC-001", "DISC-003", "DISC-065"], "media": [], "arPotential": true, "autoKeywords": ["Knox Boxes", "Emergency Boxes", "Kleenex", "Dumpster", "Knox Box", "Boxes", "Paris"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-005", "title": "Stink Pipes", "originalTitle": "Thornton’s Scent Bottle: Stink Pipes", "kicker": "Thornton’s Scent Bottle", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Camouflage", "bookReference": {"pdfPages": [33, 36], "printedPages": null, "bibliographyPdfPage": 373, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 546, "trailingNonStoryText": []}, "bookContent": {"summary": "Sydney's Hyde Park Obelisk (1857, mayor George Thornton) is a ~50-foot monument on a ~20-foot sandstone base, inspired by Cleopatra's Needles, that also vented the new sewer system (eductive design), earning the nickname Thornton's Scent Bottle. It inspired ornate brick vent shafts elsewhere in Sydney; London's 'stink pipes' are usually plainer. It now vents stormwater and has been on the New South Wales State Heritage Register since 2002.", "function": "Monument that doubles as a sewer vent, handling pressure, odor and disease.", "historicalContext": "Hyde Park (Francis Greenway's open space; Australia's oldest park); obelisk unveiled 1857; heritage listing 2002.", "keyTakeaway": "Infrastructure can be dressed as landmark, and the disguise can become a real monument.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for obelisks, lamppost-like poles or ornate brick towers in parks and along streets that might be vents.", "visualClues": ["Obelisk with sphinxes and serpents on its tapered sides", "Rusted flagpole-like pipes (London stink pipes)", "Monument-styled vents on lampposts"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Sydney", "country": "Australia", "neighbourhood": "Hyde Park", "specific": "Hyde Park Obelisk (Thornton's Scent Bottle)", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "London", "country": "United Kingdom", "neighbourhood": null, "specific": "stink pipes, utilitarian", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Barker, Geoff. “Cleopatra’s Needle or ‘Thornton’s Scent Bottle.’” Museum", "of Applied Arts & Sciences website, June 13, 2012.", "Fine, Duncan. “The Sweet Smell of Success—Hyde Park Obelisk Celebrates", "150 Years.” City of Sydney website, December 11, 2007.", "“History of Hyde Park.” City of Sydney website, updated November 1, 2016.", "“Tall Tale About City’s Aspiring Ambitions.” Daily Telegraph (Sydney),", "December 19, 2007.", "Winkless, Laurie. “Do You Know What a Stinkpipe Is?” Londonist (blog),", "updated December 14, 2016."], "relatedDiscoveries": ["DISC-006", "DISC-007"], "media": [], "arPotential": true, "autoKeywords": ["Sydney", "London", "Hyde Park Obelisk", "Stink Pipes", "Francis Greenway", "Sydney’s Hyde Park", "Australia’s", "Cleopatra’s Needles", "Egyptian", "Paris"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-006", "title": "Fake Facades", "originalTitle": "Exhaustive Outlets: Fake Facades", "kicker": "Exhaustive Outlets", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Camouflage", "bookReference": {"pdfPages": [36, 37], "printedPages": null, "bibliographyPdfPage": 374, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 614, "trailingNonStoryText": []}, "bookContent": {"summary": "Subway ventilation is camouflaged worldwide: Nuremberg's Ehekarussell sculpture (completed in the 1980s) conceals a U-Bahn exhaust port; in London the 1863 Metropolitan Railway left open vent sections in cut-and-cover routes, and 23-24 Leinster Gardens in Bayswater is a roughly one-foot-deep fake Victorian facade with painted gray window rectangles hiding a gap in the ground (prank pizza deliveries have been sent there). In Brooklyn, 58 Joralemon Street looks like a Greek Revival house but has jet-black windows and is a gutted subway ventilation and emergency egress building.", "function": "Disguises tunnel ventilation and emergency exits as houses or sculpture.", "historicalContext": "First urban underground railway opened 1863 (Metropolitan Railway); Ehekarussell completed 1980s.", "keyTakeaway": "Look for tell-tale flaws - blank painted windows, no doorbell answer - in too-perfect buildings.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Brooklyn Heights neighbourhood is Layer B (not stated in book text)"]}, "observation": {"whatToLookFor": "Look for houses with black or gray painted windows, a door that never opens, and a row-house that does not match its interior.", "visualClues": ["Gray painted rectangles instead of window panes", "Facade only a foot deep", "Jet-black windows, muntins, frames and lintels (58 Joralemon St)", "Three-story Greek Revival brick front with a stoop"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Brooklyn, New York", "country": "United States", "neighbourhood": null, "specific": "58 Joralemon Street", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "London", "country": "United Kingdom", "neighbourhood": "Bayswater", "specific": "23-24 Leinster Gardens", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Nuremberg", "country": "Germany", "neighbourhood": null, "specific": "Ehekarussell sculpture", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": "Brooklyn Heights neighbourhood is Layer B (not stated in book text)"}, "additionalResearch": [{"layer": "B", "claim": "58 Joralemon Street, Brooklyn Heights, is a Greek Revival house built in 1847 that is now a New York City Subway ventilator and emergency exit for the Joralemon Street Tunnel (IRT Lexington Avenue Line). An MTA spokesperson described it as a vent and fan plant exhausting air from the subway below.", "coordinates": {"lat": 40.693543, "lng": -73.997335, "source": "Wikipedia infobox", "status": "cross-checked against two sources (Wikipedia, Atlas Obscura); about 8 m apart"}, "sources": [{"title": "58 Joralemon Street (Wikipedia)", "url": "https://en.wikipedia.org/wiki/58_Joralemon_Street"}, {"title": "Gothamist-derived reprint quoting MTA spokesperson", "url": "https://ispr.info/?p=31490"}, {"title": "58 Joralemon Street (Atlas Obscura)", "url": "https://assets.atlasobscura.com/places/brooklyn-townhouse-secret-subway-exit"}, {"title": "Building of the Day: 58 Joralemon Street (Brownstoner)", "url": "https://www.brownstoner.com/architecture/building-of-the-day-58-joralemon-street"}], "accessed": "2026-11-17", "verification": "rechecked 2026-11-17: Atlas Obscura gives 40.693475, -73.997352, about 8 m from the Wikipedia value; Brownstoner and Atlas Obscura corroborate the 1847 build and a conversion around 1908 (Wikipedia says the IRT acquired it in 1907), cross streets Hicks Street and Willow Place; not yet checked against an official MTA or landmarks document", "neighbourhood": "Brooklyn Heights"}], "bookCitedSources": ["Manaugh, Geoff. “Brooklyn Vent.” BLDGBLOG, December 22, 2011.", "Rogers, SA. “Buildings That Don’t Exist: Fake Facades Hide Infrastructure.”", "WebUrbanist (blog), April 29, 2013.", "Ross, David. “23–24 Leinster Gardens, London’s False-Front Houses.”", "Britain Express (website), accessed September 28, 2019.", "Siksma, Walther. “Ehekarussell.” Atlas Obscura (blog), accessed October 14,", "2019.", "Slocombe, Mike. “23/24 Leinster Gardens, Paddington, London W2—", "Dummy houses in the heart of London.” Urban 75 (blog), January 2007."], "relatedDiscoveries": ["DISC-007", "DISC-005", "DISC-008", "DISC-004"], "media": [], "arPotential": true, "autoKeywords": ["London Underground", "Leinster Gardens", "Fake Facades", "Bahn", "British", "Metropolitan Railway", "Bayswater", "Victorian", "Corinthian", "Joralemon Street"], "verificationStatus": "book-reviewed-full-text; layer-B-researched"}, {"id": "DISC-007", "title": "Ventilation Buildings", "originalTitle": "Catalytic Diverters: Ventilation Buildings", "kicker": "Catalytic Diverters", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Camouflage", "bookReference": {"pdfPages": [38, 40], "printedPages": null, "bibliographyPdfPage": 374, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 528, "trailingNonStoryText": []}, "bookContent": {"summary": "The Holland Tunnel (1920s, New York-Jersey City) required proof that exhaust could be ventilated: a test tunnel in an abandoned mine, Yale student volunteers in carbon-monoxide chambers, and a finding of ~1,000 cubic feet of air per second. Four ventilation buildings (two on shore, two more than 100 feet tall in the Hudson) with dozens of fans replace the tunnel air every 90 seconds. Engineer Clifford Holland gave the tunnel its name; Norwegian architect Erling Owre designed the buildings with Modernist influences (steel girders, concrete columns, yellow brick, arches, gargoyle heads).", "function": "Fan-equipped ventilation towers that make a long vehicular tunnel breathable.", , "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-016", "title": "Constructive Reuse", "originalTitle": "Spolia of War: Constructive Reuse", "kicker": "Spolia of War", "chapter": "INCONSPICUOUS", "chapterNumber": 1, "subcategory": "Accretions", "bookReference": {"pdfPages": [62, 67], "printedPages": null, "bibliographyPdfPage": 378, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 827, "trailingNonStoryText": ["Section teaser at end: 'Flags, monuments, plaques, signage, and advertisements' (not story text)"]}, "bookContent": {"summary": "WWII steel stretchers (600,000+ made) were reused by the London County Council as housing-estate railings in Peckham, Brixton, Deptford and Oval; the Stretcher Railing Society catalogues them. Cannon bollards (17th century onward; Halifax, Havana) were often cheap iron, not trophies, and modern copies exist. Spolia (stone reused from demolished buildings) are as old as cities; archaeologist Peter Sommer likens them to artists building on earlier works.", "function": "Reuse of war materials in street furniture.", "historicalContext": "WWII stretchers; 17th-century cannon bollards; Napoleonic-era tales.", "keyTakeaway": "Many city parts are older than they look, repurposed across generations.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for curved black mesh railings (stretchers) and cannon-shaped bollards.", "visualClues": ["Black wire-mesh panels with curved supports", "Cannon-shaped bollards at corners"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "London", "country": "United Kingdom", "neighbourhood": null, "specific": "stretcher railings in Peckham, Brixton, Deptford, Oval", "precision": "neighbourhood", iginalTitle": "Vexillology Rules: Municipal Flags", "kicker": "Vexillology Rules", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Identity", "bookReference": {"pdfPages": [71, 75], "printedPages": null, "bibliographyPdfPage": 380, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 1211, "trailingNonStoryText": []}, "bookContent": {"summary": "Pocatello, Idaho's flag was ranked worst of 150 US city flags in a 2004 NAVA survey (Roman Mars's 2015 TED talk popularized it). Ted Kaye's five principles: keep it simple, use meaningful symbolism, use two or three basic colors, no lettering or seals, be distinctive or be related. Chicago's flag (two blue stripes for Lake Michigan and the Chicago River; four red six-pointed stars for Fort Dearborn, the Great Fire, the Columbian Exposition and the Century of Progress) works; San Francisco's phoenix flag is detailed and spells out the city name; 'seal on a bedsheet' (SOB) flags fail. Pocatello adopted 'Mountains Left' (three red mountains, gold compass rose, blue Portneuf River line), and other cities have begun redesigns.", "function": "Civic identity carried on cloth; shows what makes a design work at distance.", "historicalContext": "2004 NAVA survey; 2015 TED talk; 2016 Pocatello committee; Chicago stars span Fort Dearborn to the Century of Progress.", "keyTakeaway": "A good city flag is a remixable banner for civic pride; bad ones cede ground to sports and corporate logos.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Compare the flag on your city hall with Kaye's five principles; look for seals on solid fields and lettering.", "visualClues": ["Seal on a solid field (SOB)", "City name spelled out on flag", "Chicago stars used on mugs, shirts and tattoos"], "source": "editorial prompt derived from the full text of the stor rait; recovers the model behind public monuments.", "historicalContext": "1907 discovery; Beaux Arts era; 1915 Panama-Pacific Exposition; Modernism ended demand.", "keyTakeaway": "Many public monuments carry the face of a largely forgotten person.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Neighbourhoods are inferred from named streets and not stated in book text", "Book spells the name Munson and Munson/Munson inconsistently"]}, "observation": {"whatToLookFor": "Look at allegorical female figures on NYC fountains, buildings and bridges and consider who modeled for them.", "visualClues": ["Allegorical female figure on a fountain", "Gold statue atop the Manhattan Municipal Building", "Figure leaning against a horse at the library"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "New York City", "country": "United States", "neighbourhood": "Midtown", "specific": "Main branch of the New York Public Library (statue leaning on a white horse)", "precision": "exact-site", "source": "book text (full-text review)", "verification": "neighbourhood inferred; requires verification"}, {"city": "New York City", "country": "United States", "neighbourhood": "Midtown", "specific": "Fountain at 59th Street and Fifth Avenue", "precision": "named-street", "source": "book text (full-text review)", "verification": "neighbourhood inferred; requires verification"}, {"city": "New York City", "country": "United States", "neighbourhood": "Upper West Side", "specific": "107th Street and Broadway (reclining figure)", "precision": "named-street", "source": "book text (full-text review)", "verification": "neighbourhood inferred; requires verification"}, {"city": "New York City", "country": "United States", "neighbourhood": "Lower Manhattan", "specific": "Manhattan Municipal Building (gold ", "verificationFlag": []}, "observation": {"whatToLookFor": "Stop at plaques on buildings, sidewalks and hydrants; ask who erected it, when, and what it leaves out.", "visualClues": ["Round blue plaque (London)", "Gold-painted hydrant with adjacent plaque"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "San Francisco", "country": "United States", "neighbourhood": "Mission District", "specific": "Gold hydrant", "precision": "neighbourhood", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Portland", "country": "United States", "neighbourhood": null, "specific": "Smith Memorial Student Union, Portland State University", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "London", "country": "United Kingdom", "neighbourhood": null, "specific": "English Heritage blue plaques", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Allen, Kester. “Read the Plaque.” Read the Plaque website.", "“Gold Fire Hydrant—1906 Earthquake.” Roadside America website,", "accessed February 4, 2020.", "Kohlstedt, Kurt. “Always Read the Plaque: Mapping Over 10,000 Global", "Markers & Memorials.” 99% Invisible (blog), May 13, 2016.", "Loewen, James W. Lies Across America: What Our Historic Sites Get", "Wrong. 20th anniversary edition. New York: The New Press, 2019.", "“London’s Blue Plaques.” English Heritage website, accessed February 4,", "2020.", "“Michael J. Smith.” Read the Plaque website, accessed February 4, 2020.", "Neno, Eric, and Nell Veshistine. “60B: Heyward Shepherd Memorial.” 99%", "Invisible (podcast and MP3 audio), September 10, 2012."], "relatedDiscoveries": ["DISC-018", "DISC-077"], "media": [], "arPotential": true, "autoKeywords": ["Historical Plaques", "Memorial Student Union", "Portland State University", "Michael Smith", "College Bowl", "Marr", "It’s", "Mission District of San Francisco", "San Francisco", "Mission District"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-020", "title": "That Fancy Shape", "originalTitle": "Distinguished Features: That Fancy Shape", "kicker": "Distinguished Features", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Identity", "bookReference": {"pdfPages": [81, 84], "printedPages": null, "bibliographyPdfPage": 381, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 657, "trailingNonStoryText": ["Section teaser at end: 'Traffic lights, retro-reflective studs, and recognition patterns at night' (not story text)"]}, "bookContent": {"summary": "The quatrefoil, a four-lobed shape, appears from Gothic cathedrals and Newport cottages to handbags. The word dates to the 15th century (quatre + foil) but the shape is older (Byzantine Constantinople, Mesoamerica). Historian Christy Anderson traces it via Islamic geometry and the Silk Road into European tracery and religious use. Nineteenth-century pattern books like Owen Jones's The Grammar of Ornament (1856, proposition 13 favoring abstraction over natural objects) spread it into design.", "function": "Ornamental shorthand for luxury and sophistication.", "historicalContext": "Byzantine and Mesoamerican use; 15th-century term; 19th-century Gothic Revival and pattern books.", "keyTakeaway": "Abstracting nature into repeatable geometry made the quatrefoil ubiquitous.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for four-lobed openings and cutouts on railings, bridges, windows and facades.", "visualClues": ["Four-lobed window or relief", "Repeating quatrefoils in railings"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Newport, Rhode Island", "country": "United States", "neighbourhood": null, "specific": "cottages with quatrefoils", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Washington, D.C.", "country": "United States", "neighbourhood": null, "specific": "Washington National Cathedral", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Anderson, Christy. Renaissance Architecture. Oxford, UK: Oxford", "University Press, February 2013.", "Jones, Owen. The Grammar of Ornament London: Day & Sons, 1856.", "Tate, Carolyn E. Yaxchilan: The Design of a Maya Ceremonial City. Austin:", "University of Texas Press, August 2013.", "Trufelman, Avery. “The Fancy Shape.” Invisible (podcast and MP3 audio),", "March 17, 2014."], "relatedDiscoveries": ["DISC-017", "DISC-021"], "media": [], "arPotential": true, "autoKeywords": ["Europe", "Gothic Revival", "Anderson", "That Fancy Shape", "Victorian", "Mission-style", "Newport", "Rhode Island", "Washington National Cathedral", "Anglo-"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-021", "title": "Traffic Lights", "originalTitle": "Mixed Signals: Traffic Lights", "kicker": "Mixed Signals", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Safety", "bookReference": {"pdfPages": [85, 87], "printedPages": null, "bibliographyPdfPage": 381, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 742, "trailingNonStoryText": []}, "bookContent": {"summary": "At Tompkins Street and Milton Avenue in Syracuse's Tipperary Hill, the traffic signal is upside down, green over red, because early-1900s locals objected to Unionist red above Irish green and broke red lights; Alderman John 'Huckle' Ryan petitioned, the state overturned, and officials eventually left it inverted. Tipperary Hill Memorial Park (Stone Throwers' Park, 1994) has statues, Irish-name bricks, a flag and shamrock fence. In Japan, go lights are officially ao (blue), and a 1973 cabinet order required the bluest possible green.", "function": "Traffic signals that show how culture shapes infrastructure.", "historicalContext": "Early 1900s signal; 1994 park; 1973 Japanese cabinet order.", "keyTakeaway": "Even the red-yellow-green convention is not universal.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Check unusual signals and colors, and memorial parks that explain them.", "visualClues": ["Upside-down signal", "Statue of father pointing and son with a slingshot", "Green fence with shamrocks"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Syracuse", "country": "United States", "neighbourhood": "Tipperary Hill", "specific": "Tompkins Street and Milton Avenue", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Japan", "country": "Japan", "neighbourhood": null, "specific": "blue-green traffic lights", "precision": "country", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Grabowski, Charley. “Tipperary Hill.” Apple’s Tree (blog), November 14,", "2007.", "“International Road Signs Guide.” Auto Europe website, accessed October 7,", "2019.", "Kirst, Sean. “In Syracuse, an Irish lesson for the prime minister: Rocks", "against red lift green on Tipp Hill.” Syracuse.com (blog), updated March", "23, 2019.", "Kirst, Sean. “On Tipp Hill, longtime neighbor keeps watch over Stone", "Throwers’ Park.” Syracuse.com (blog), updated March 23, 2019.", "McCarthy, John Francis. “Legends of Tipp Hill: In Syracuse’s Irish", "neighborhood, facts rarely get in the way of a good story.” Syracuse.com", "(blog), updated March 22, 2019.", "Pilling, Michael, and Ian Davies. “Linguistic relativism and colour", "cognition.” British Journal of Psychology 95, no. 4 (2004): 429–55.", "Richarz, Allan. “According to Japanese Traffic Lights, Bleen Means Go.”", "Atlas Obscura (blog), September 12, 2017.", "Scott, Tom. All the Colours, Including Grue: How Languages See Colours", "Differently. YouTube video, posted June 7, 2013.", "“Stone Throwers’ Park.” City of Syracuse website, accessed February 4,", "2020.", "Tulloch, Katrina. “Green-over-red stoplight: Stone throwers remembered for", "stubborn Irish spirit.” Syracuse.com (blog), updated January 30, 2019."], "relatedDiscoveries": ["DISC-022", "DISC-023", "DISC-024", "DISC-052"], "media": [], "arPotential": true, "autoKeywords": ["Japanese", "Japan", "Ireland", "Irish", "Syracuse", "Traffic Lights", "York", "United States", "Tompkins Street", "Milton Avenue"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-022", "title": "Retroreflective Studs", "originalTitle": "Visibility Aids: Retroreflective Studs", "kicker": "Visibility Aids", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Safety", "bookReference": {"pdfPages": [87, 90], "printedPages": null, "bibliographyPdfPage": 382, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 854, "trailingNonStoryText": []}, "bookContent": {"summary": "Percy Shaw of Halifax, England reportedly invented cat's eyes in 1933 after a cat's glowing eyes saved him on Queensbury Road; they have two glass beads in a cast-iron shell, with a rubber wiper that cleans them. Adoption took off in WWII blackouts (40,000 units a week). California's Botts' dots (Elbert Dysart Botts, Caltrans) were mandated on non-snowy freeways in 1966, with more than 25 million placed, but are being replaced by thermoplastic striping. Colored raised markers mark hydrants, access points and wrong-way directions. Shaw has a blue plaque and rode in a Rolls-Royce to his pub.", "function": "Retroreflective road markers that guide drivers at night.", "historicalContext": "1933 invention; WWII; 1966 California mandate.", "keyTakeaway": "Regional conditions produce different solutions to the same visibility problem.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book says the account is as told by Shaw's brother Cecil"]}, "observation": {"whatToLookFor": "Look at lane markers: color, one-sided or two-sided reflection, and what they signal.", "visualClues": ["Two glass eyes in an iron housing", "Round raised dots", "Blue raised marker near a hydrant", "Red on one side, white on the other"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Halifax", "country": "United Kingdom", "neighbourhood": null, "specific": "Percy Shaw's home and Queensbury Road", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "California", "country": "United States", "neighbourhood": null, "specific": "Botts' dots", "precision": "state", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book says the account is as told by Shaw's brother Cecil"}, "additionalResearch": [], "bookCitedSources": ["Colvile, Robert. “Percy Shaw: Man with his eye on the road.” The Telegraph", "(UK), November 30, 2007.", "“Guidelines for the Use of Raised Pavement Markers: Section 2. RPM", "Guidelines.” Federal Highway Administration website, accessed February", "4, 2020.", "Irish, Vivian. “Percy Shaw OBE (1890–1976)—a successful inventor and", "entrepreneur.” Yorkshire Philosophical Society website, accessed October", "8, 2019.", "Migletz, James, Joseph K. Fish, and Jerry L. Graham. Roadway Delineation", "Practices Handbook. Washington, DC: Federal Highway Administration,", "1994.", "“Percy Shaw O.B.E. 15th April 1890 to 1st September 1976.” Reflecting", "Roadstuds website, accessed October 8, 2019.", "Plester, Jeremy. “Weatherwatch: Percy Shaw and the invention of the cat’s", "eye reflector.” The Guardian, December 3, 2018.", "Richards, Gary. “Caltrans says bye-bye to Botts’ dots.” Mercury News (San", "Jose, CA), August 23, 2017.", "Stein, Mark A. “On the Button: The Quest to Perfect Botts’ Dots Continues.”", "Los Angeles Times, August 11, 1991.", "Swinford, Steven. “End of the road for cats eyes?” The Telegraph, September", "4, 2015.", "Vanhoenacker, Mark. “Reflections on Things That Go Bump in the Night.”", "Slate (blog), January 23, 2014.", "Winslow, Jonathan. “Botts’ Dots, after a half-century, will disappear from", "freeways, highways.” The Orange County Register (Anaheim, CA), May", "21, 2017."], "relatedDiscoveries": ["DISC-021", "DISC-023", "DISC-024", "DISC-043"], "media": [], "arPotential": true, "autoKeywords": ["Shaw", "California", "Botts’", "Retroreflective Studs", "Old Dolphin", "Clayton Heights", "Queensbury Road", "England", "Shaw’s", "World War"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-023", "title": "Recognition Patterns", "originalTitle": "Checkered Past: Recognition Patterns", "kicker": "Checkered Past", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Safety", "bookReference": {"pdfPages": [90, 94], "printedPages": null, "bibliographyPdfPage": 383, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 1192, "trailingNonStoryText": []}, "bookContent": {"summary": "US police cars are typically black and white (Dallas PD: it signals law enforcement). Checkered police patterns trace to Scottish heraldry and glengarry hatbands; Glasgow police adopted a checkered cap band in the 1930s under chief constable Sir Percy Sillitoe, giving the Sillitoe Tartan (not strictly a tartan, per the Scottish Register of Tartans), now used in the UK, Brazil, South Africa, Iceland, Australia and elsewhere. Battenburg markings (1990s, UK Police Scientific Development Branch) use one or two rows of large retroreflective blue and yellow blocks; paramedic John Killeen: 'Sillitoe is a recognition pattern, not a high-visibility marking scheme.' Overly elaborate designs reduce legibility.", "function": "Pattern language that identifies emergency vehicles.", "historicalContext": "WWI-era Scottish caps; 1930s Glasgow; 1990s UK Battenburg research.", "keyTakeaway": "Choose emergency markings by testing recognition and visibility, not by copying.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Note checker rows on police and ambulance vehicles: one or two rows of large blocks or three rows of small squares.", "visualClues": ["Three rows of small checks (Sillitoe)", "One or two rows of large blue-yellow blocks (Battenburg)", "Black-and-white US cruiser"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Glasgow", "country": "United Kingdom", "neighbourhood": null, "specific": "origin of Sillitoe checks", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Dallas", "country": "United States", "neighbourhood": null, "specific": "black-and-white police cars", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Western Australia", "country": "Australia", "neighbourhood": null, "specific": "Battenburg ambulance", "precision": "region", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["“Chief Constable Sir Percy Sillitoe.” Rotary International, Howe of Fife", "(blog), September 26, 2017.", "Harrison, Paul. High Conspicuity Livery for Police Vehicles. Hertfordshire,", "UK: Home Office, Police Scientific Development Branch, 2004.", "Killeen, John. “The difference between Battenburg high-visibility markings", "and Sillitoe chequers on Police, Fire & Ambulance vehicles.” Ambulance", "Visibility (blog), April 27, 2012.", "Scott, Mike. “Designing Police Vehicles: It’s Not Just “Black and White.’”", "Government Fleet (blog), March 18, 2010.", "“The Sillitoe Tartan.” Glasgow Police Museum website, accessed October", "10, 2019.", "“Tartan Details—Sillitoe.” The Scottish Register of Tartans website, accessed", "October 11, 2019.", "U.S. Fire Administration. Emergency Vehicle Visibility and Conspicuity", "Study. Emmitsburg, MD: U.S. Department of Homeland Security, 2009."], "relatedDiscoveries": ["DISC-022", "DISC-024"], "media": [], "arPotential": true, "autoKeywords": ["Sillitoe", "Battenburg", "United Kingdom", "Scottish", "Glasgow", "Sir Percy Sillitoe", "Sillitoe Tartan", "England", "Killeen", "Recognition Patterns"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-024", "title": "Warning Symbols", "originalTitle": "Memorable but Meaningless: Warning Symbols", "kicker": "Memorable but Meaningless", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Safety", "bookReference": {"pdfPages": [94, 99], "printedPages": null, "bibliographyPdfPage": 383, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 1741, "trailingNonStoryText": []}, "bookContent": {"summary": "The biohazard symbol was created by Dow Chemical's Charles Baldwin and NIH's Robert Runkle (Science, 1967) after inconsistent lab labels (Army blue triangle, Navy pink rectangle, postal violet snake staff). Six criteria, tested on 300 people in 25 cities against 18 familiar symbols for meaningfulness and memorability, produced an orange trefoil: 'memorable but meaningless'. It resembles the earlier Berkeley radiation trefoil, was adopted by CDC and OSHA, and is now diluted by shirts and mugs. The Waste Isolation Pilot Plant in New Mexico (Gregory Benford; Human Interference Task Force) needs warnings lasting ~10,000 years; proposals included comic panels, spike fields, an atomic priesthood (Sebeok), and glowing cats (Bastide and Fabbri).", "function": "Designing a danger symbol whose meaning is taught, not guessed.", "historicalContext": "1967 biohazard symbol; 1980s DOE WIPP warnings; 1984 German Journal of Semiotics.", "keyTakeaway": "Symbols lose power when they become fashion; long-term warnings remain unsolved.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book places WIPP in southeastern New Mexico without naming a nearby town; do not pin to Carlsbad without verification"]}, "observation": {"whatToLookFor": "Check labs, waste containers and merchandise for the three-lobed symbol and compare it with radiation trefoils.", "visualClues": ["Orange trefoil of three-way symmetry", "Biohazard symbol printed on a mug or tie"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Carlsbad area, New Mexico", "country": "United States", "neighbourhood": null, "specific": "Waste Isolation Pilot Plant ('southeastern plains of New Mexico')", "precision": "region", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book places WIPP in southeastern New Mexico without naming a nearby town; do not pin to Carlsbad without verification"}, "additionalResearch": [], "bookCitedSources": ["Baldwin, C. L., and R. S. Runkle. “Biohazards Symbol: Development of a", "Biological Hazards Warning Signal.” Science 158, no. 3798 (1967): 264–", "265.", "Cook, John. “Symbol Making.” New York Times Magazine, November 18,", "2001.", "Frame, Paul. “Radiation Warning Symbol (Trefoil).” Oak Ridge Associated", "Universities website, accessed February 4, 2020.", "Haubursin, Christophe, Kurt Kohlstedt, and Roman Mars. “Beyond", "Biohazard: Why Danger Symbols Can’t Last Forever.” 99% Invisible and", "Vox Media, January 26, 2018.", "Hora, Steven C., Detlof von Winterfeldt, and Kathleen M. Trauth. Expert", "Judgment on Inadvertent Human Intrusion into the Waste Isolation Pilot", "Plant. Albuquerque, NM: U.S. Department of Energy, 1991.", "Human Interference Task Force. “Reducing the likelihood of future human", "activities that could affect geologic high-level waste repositories.” Report", "for the Office of Nuclear Waste Isolation, May 1984.", "Kielty, Matthew. “114: Ten Thousand Years.” 99% Invisible (podcast and", "MP3 audio), May 12, 2014.", "Lerner, Steve. Sacrifice Zones: The Front Lines of Toxic Chemical Exposure", "in the United States. Cambridge, MA: MIT Press, 2012."], "relatedDiscoveries": ["DISC-025", "DISC-023"], "media": [], "arPotential": true, "autoKeywords": ["Baldwin", "Warning Symbols", "Army", "Navy", "Universal Postal Convention", "Dow Chemical Company", "National Institutes of Health", "Charles", "Robert", "Science"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-025", "title": "Shelter Markers", "originalTitle": "Signs of Times: Shelter Markers", "kicker": "Signs of Times", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Safety", "bookReference": {"pdfPages": [99, 104], "printedPages": null, "bibliographyPdfPage": 384, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 938, "trailingNonStoryText": ["Section teaser at end: 'Hand-painted graphics, neon lights, and production placards' (not story text)"]}, "bookContent": {"summary": "Artesia, New Mexico built the Abo school underground during the Cold War, with a morgue, decontamination showers, supplies and room for 2,000+ people. After Kennedy's 1961 call to identify and mark shelters, the Army Corps surveyed sites and Robert Blakeley designed the yellow-triangles-in-black-circle FALLOUT SHELTER sign (similar to radiation trefoils, a potential source of confusion); over a million were made. Signs also became antiwar iconography and symbols of militarization; Moscow's press condemned Artesia.", "function": "Signage for a national shelter system.", "historicalContext": "1961 Kennedy address; Cold War; Army Corps survey; Office of Civil Defense funding.", "keyTakeaway": "Shelter signs are artifacts of a fear era and prove design can carry political meaning.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Remove NYC entry: the book does not mention New York in this story"]}, "observation": {"whatToLookFor": "Look on older buildings for yellow-black fallout shelter signs.", "visualClues": ["Three yellow triangles inside a black circle", "Block lettering FALLOUT SHELTER", "Space for capacity numbers"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Artesia", "country": "United States", "neighbourhood": null, "specific": "Abo elementary school (New Mexico)", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "exact-location", "coordinates": null, "coordinatesStatus": "not verified", "note": "Remove NYC entry: the book does not mention New York in this story"}, "additionalResearch": [], "bookCitedSources": ["“Abo Elementary School and Fallout Shelter.” US National Park Service", "website, updated December 27, 2017.", "“The Abo School.” Atomic Skies (blog), July 12, 2013.", "Kennedy, John F. “Radio and television report to the American people on the", "Berlin crisis.” John F. Kennedy Presidential Library and Museum, July 25,", "1961.", "Klara, Robert. “Nuclear Fallout Shelters Were Never Going to Work.”", "History (blog), September 1, 2018.", "McFadden, Robert D. “Obituary: Robert Blakely, Who Created a Sign of the", "Cold War, Dies at 95.” New York Times, October 27, 2017.", "Mingle, Katie. “121: Cold War Kids.” 99% Invisible (podcast and MP3", "audio), July 1, 2014."], "relatedDiscoveries": ["DISC-024", "DISC-023"], "media": [], "arPotential": true, "autoKeywords": ["Cold War", "Robert Blakely", "Shelter Markers", "Abo Gopher", "President John", "Tensions", "Soviet Union", "Kennedy", "Congress", "Following Kennedy’s"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-026", "title": "Hand-Painted Graphics", "originalTitle": "Broad Strokes: Hand-Painted Graphics", "kicker": "Broad Strokes", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Signage", "bookReference": {"pdfPages": [105, 106], "printedPages": null, "bibliographyPdfPage": 385, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 599, "trailingNonStoryText": []}, "bookContent": {"summary": "Sign painters were 'mechanics' who lettered shops and street signs by hand, working fast on piecework, sometimes hanging from buildings or traveling for jobs. A master could draw an O in a few brush strokes. The vinyl plotter and 1980s software made signs easy and cheap but changed the look of cities. Vintage hand-painted signs remain a visual archaeology (Laura Fraser) and are returning at boutiques, cafes and food trucks because imperfections signal a person's care.", "function": "Craft behind city lettering.", "historicalContext": "20th-century sign painting; vinyl plotter and 1980s machines.", "keyTakeaway": "Hand-painted marks signal human craft.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for brushstrokes, uneven edges and aging on signs.", "visualClues": ["Rounded letters in few strokes", "Faded vintage lettering on walls", "Brushed lettering on a cafe window"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "not place-specific", "places": [], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Fraser, Laura. “The New Sign Painters.” Craftsmanship Quarterly, Spring", "2017.", "Levine, Faythe, and Sam Macon. Sign Painters. Hudson, NY: Princeton", "Architectural Press, 2012.", "Rich, Sara C. “The Return of the Hand-Painted Sign.” Smithsonian,", "November 2, 2012.", "Walker, Benjamin. “74: Hand Painted Signs.” Invisible (podcast and MP3", "audio), March 8, 2013."], "relatedDiscoveries": ["DISC-027", "DISC-029", "DISC-030"], "media": [], "arPotential": true, "autoKeywords": ["Hand-", "Painted Graphics", "American", "Older", "Laura Fraser", "Craftmanship Quarterly", "Ouija"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-027", "title": "Neon Lights", "originalTitle": "Tube Benders: Neon Lights", "kicker": "Tube Benders", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Signage", "bookReference": {"pdfPages": [107, 108], "printedPages": null, "bibliographyPdfPage": 385, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 790, "trailingNonStoryText": []}, "bookContent": {"summary": "Oakland's Tribune Tower is topped with neon TRIBUNE letters and four neon clocks, kept lit by contractor John Vincent Law after years dark. Neon gas was discovered in 1898 (Ramsay and Travers); Georges Claude pioneered signs (first, a Paris barbershop); Claude Neon brought them to the US in the 1920s, and by the 1930s Manhattan and Brooklyn had 20,000 neon ads. Neon became associated with vice and decay; San Francisco's Market Street and New York removed most, and Hong Kong's rules removed many. Tube benders still hand-shape glass tubes, so repair is costly and broken signs are replaced with LEDs.", "function": "Hand-crafted gas-tube advertising and landmarks.", "historicalContext": "1898 discovery; early 1900s Claude; 1920s US; 1930s peak; 1960s removals.", "keyTakeaway": "Neon is craft work and endangered heritage.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for glowing glass tubes, red (neon) vs blue (argon and mercury), and dark broken signs.", "visualClues": ["Red letters on a tower at night", "Glass tubes bent into letters", "Dark nonworking neon signs"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": ember 13, 2015.", "Tse, Crystal. “Hong Kong Is Slowly Dimming Its Neon Glow.” New York", "Times, October 13, 2015."], "relatedDiscoveries": ["DISC-026", "DISC-028", "DISC-030"], "media": [], "arPotential": true, "autoKeywords": ["Tribune Tower", "Claude Neon", "Oakland", "Neon Lights", "Sir William Ramsay", "Morris Travers", "Greek", "Frenchman", "Georges Claude", "Paris"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-028", "title": "Inflatable Figures", "originalTitle": "Sky Dancers: Inflatable Figures", "kicker": "Sky Dancers", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Signage", "bookReference": {"pdfPages": [109, 111], "printedPages": null, "bibliographyPdfPage": 385, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 676, "trailingNonStoryText": []}, "bookContent": {"summary": "Inflatable tube figures at dealerships trace to Trinidadian artist Peter Minshall's dancing puppets and his idea, for the 1996 Atlanta Olympics, of fan-powered inflatables (Tall Boys), built with Israeli artist Doron Gazit, who later patented Fly Guys and licensed them. Minshall wishes he had been consulted. Houston banned them in 2008 as visual clutter; Air Rangers with angry faces scare birds from farms.", "function": "Attention-grabbing advertising with a story of artistic credit.", "historicalContext": "1992 Barcelona and 1996 Atlanta Olympics; 2008 Houston ordinance.", "keyTakeaway": "Gaudy objects can carry a cultural origin and an authorship dispute.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Note the figure at dealerships: legs or arms, face, fan base.", "visualClues": ["Vinyl column on a fan", "Painted-on smiling face", "Angry-faced scarecrow type (Air Ranger)"], "source": "editorial prompt derived from the full text of the story; not quoted from the b  []}, "bookContent": {"summary": "Los Angeles is full of unofficial yellow production placards (10,000+ per year) that direct crews to film locations: black code names above and below an arrow, the lower text upside down so the sign flips. Code names hide titles (CORPORATE HEADQUARTERS for the Star Trek reboot until fans decoded it, then WALTER LACE; FREEZER BURN hints at Captain America). Too-funny names get stolen. JCL Traffic Services's Jim Morris says GPS cannot find many locations; a client's blue-and-white signs were ignored within three days. YACHT's 'L.A. Plays Itself' video used them.", "function": "Wayfinding for film crews.", "historicalContext": "Not dated.", "keyTakeaway": "Ad hoc sign systems persist because they work.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": []}, "observation": {"whatToLookFor": "Look for yellow 18x24-inch signs with odd words and arrows on poles and cones.", "visualClues": ["Yellow board with black arrow and mirrored text", "Code words like FREEZER BURN"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "city-level", "places": [{"city": "Los Angeles", "country": "United States", "neighbourhood": null, "specific": "production placards across the city", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "city-neighbourhood", "coordinates": null, "coordinatesStatus": "not verified", "note": null}, "additionalResearch": [], "bookCitedSources": ["Ferguson, Kevin. “The story behind LA’s mysterious yellow and black", "filming location signs.” Off-Ramp (podcast and MP3 audio), January 30,", "2015.", "Kohlstedt, Kurt. “LA. Misdirection: Secret Codes on Yellow Filming", "Location Signs.” 99% Invisible (blog), March 7, 2016.", "Millar, Diangelea. “Film set signs specialize in misdirection.” Los Angeles", "Times, July 10, 2013.", "Roberts, Randall. “Pop duo YACHT talks about yellow film location signs", "and visual language in “LA. Plays Itself.’” Los Angeles Times, September", "24, 2015."], "relatedDiscoveries": ["DISC-026", "DISC-030", "DISC-017"], "media": [], "arPotential": true, "autoKeywords": ["Los Angeles", "Morris", "Production Placards", "Star Trek", "Captain America", "World War", "Itself", "Jim Morris", "Traffic Services", "City of Angels"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-030", "title": "Absent Advertising", "originalTitle": "Minded Businesses: Absent Advertising", "kicker": "Minded Businesses", "chapter": "CONSPICUOUS", "chapterNumber": 2, "subcategory": "Signage", "bookReference": {"pdfPages": [113, 117], "printedPages": null, "bibliographyPdfPage": 386, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 899, "trailingNonStoryText": ["Trailing text 'Chicago River reversed for waste management purposes' is the next section's opening teaser, not story text"]}, "bookContent": {"summary": "Sao Paulo's 2006 Lei Cidade Limpa (mayor Gilberto Kassab) removed 10,000+ billboards and hundreds of thousands of signs; Clear Channel sued and lost; businesses had 90 days. The city's architecture reappeared, businesses repainted, street artists got canvases but some sanctioned murals were erased, leading to a mural registry. Removing ads also exposed favelas and factories where people lived. Other bans: Alaska, Hawaii, Maine, Vermont, Beijing's luxury-apartment ads, Paris, Tehran temporarily. Sao Paulo later allowed ads that provide services (search ads at bus shelters; 32 LED boards tied to bridge upkeep).", "function": "Citywide ad ban with unintended social revelations.", "historicalContext": "2006 law.", "keyTakeaway": "Ads can mask urban problems.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-te ick ads? Inside the global movement to ban", "urban billboards.” The Guardian, August 12, 2015.", "Plummer, Robert. “Brazil’s ad men face billboard ban.” BBC News,", "September 19, 2006.", "Queiroz Galvão, Vinícius. “Retirada de outdoors revela favela na avenida 23", "de Maio.” Folha de S. Paulo, April 19, 2007.", "Rogers, SA. “Super Clean City: São Paulo Entirely Scrubbed of Outdoor", "Ads.” WebUrbanist (blog), March 3, 2010.", "“Visual pollution: Advertising firms fret over billboard bans.” The", "Economist, October 11, 2007.", "Wentz, Laurel. “São Paulo’s Ingenious Move for Return of Banned", "Billboards.” AdAge, October 30, 2017.", "Winterstein, Paulo. “Scrub São Paulo’s Graffiti? Not So Fast, London’s Tate", "Says.” Bloomberg, August 24, 2008."], "relatedDiscoveries": ["DISC-027", "DISC-029", "DISC-028"], "media": [], "arPotential": false, "autoKeywords": ["São Paulo", "Absent Advertising", "Gilberto Kassab", "Cidade Limpa", "São Paulo’s", "Channel Outdoor", "Vinícius Galvão", "On the Media", "Suddenly", "Alaska"], "verificationStatus": "book-reviewed-full-text"}, {"id": "DISC-031", "title": "Incidental Bridge", "originalTitle": "Bureaucracy Inaction: Incidental Bridge", "kicker": "Bureaucracy Inaction", "chapter": "INFRASTRUCTURE", "chapterNumber": 3, "subcategory": "Civic", "bookReference": {"pdfPages": [121, 124], "printedPages": null, "bibliographyPdfPage": 388, "source": "Attached book PDF (ebook export; 469 PDF pages, printed page numbers not preserved)", "wordsInStory": 843, "trailingNonStoryText": []}, "bookContent": {"summary": "Durham, North Carolina's Norfolk Southern-Gregson Street Overpass (built 1940), the 'Can Opener' or 11-foot-8 Bridge, repeatedly peeled the tops off trucks. Jurgen Henn filmed it from 2008 and posted 100+ videos. Warnings (signs, flashing lights, a 2016 OVERHEIGHT MUST TURN LED sign with sensors and signal) and a crash beam failed. Raising or lowering the street was impractical (sewer main, delivery access). In October 2019 the 92 Act; 1860s home delivery.", "keyTakeaway": "The post office built America and serves places a private carrier would skip.", "readDepth": "full story text read and checked against the book PDF pages", "reviewStatus": "full-text-reviewed", "verificationFlag": ["Book gives Arizona only implicitly (Grand Canyon); state name inferred"]}, "observation": {"whatToLookFor": "Note post offices, blue boxes and routes in remote places; ask how the post shaped the town.", "visualClues": ["Post office in a rural store", "Mule pack train"], "source": "editorial prompt derived from the full text of the story; not quoted from the book"}, "geography": {"locationType": "specific-site", "places": [{"city": "Supai, Arizona", "country": "United States", "neighbourhood": null, "specific": "Supai post office, Grand Canyon (Havasupai reservation)", "precision": "exact-site", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}, {"city": "Albany", "country": "United States", "neighbourhood": null, "specific": "1754 meeting", "precision": "city", "source": "book text (full-text review)", "verification": "stated in book; coordinates not verified"}], "mapRepresentation": "none", "coordinates": null, "coordinatesStatus": "not verified", "note": "Book gives Arizona only implicitly (Grand Canyon); state name inferred"}, "additionalResearch": [], "bookCitedSources": ["“Benjamin Franklin, First Postmaster General.” U.S. Postal Service website,", "accessed October 23, 2019.", "Gallagher, Winifred. How the Post Office Created America: A History. New", "York: Penguin Press, 2016.", "“Mail Service and the Civil War.” The USPS website.", "Mingle, Katie. “244: The Revolutionary Post.” 99% Invisible (podcast and", "MP3 audio), January 24, 2017.", "Ostroff, Hannah S. “In the Grand Canyon, the U.S. Postal Service still", "delivers mail by mule.” Smithsonian Insider (blog), August 25, 2016.", "Ritholtz, Barry. “Congress, Not Amazon, Messed Up the Post Office
